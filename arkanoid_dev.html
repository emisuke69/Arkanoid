  }
  ctx.shadowBlur=0;

  // Phase overlays
  ctx.textAlign='center';
  if(s.phase==='idle'){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);
    // Title glow
    ctx.shadowColor='#4da6ff';ctx.shadowBlur=32;
    ctx.fillStyle='#ffffff';ctx.font='bold 34px Courier New';ctx.fillText('ARKANOID',W/2,68);
    ctx.shadowBlur=0;
    // Title underline
    const tlg=ctx.createLinearGradient(W/2-100,0,W/2+100,0);
    tlg.addColorStop(0,'rgba(77,166,255,0)');tlg.addColorStop(0.5,'rgba(77,166,255,0.7)');tlg.addColorStop(1,'rgba(77,166,255,0)');
    ctx.fillStyle=tlg;ctx.fillRect(W/2-100,72,200,1);
    ctx.font='11px Courier New';
    [['↔️ Breit','#4da6ff'],['🐢 Langsam','#30d158'],['⚡ Multiball','#ffd60a'],
     ['❤️ +Leben','#ff2d55'],['🔫 Laser  (Z / Doppeltap)','#bf5af2'],
     ['🧲 Catch – klebt, Tippen=Abschuss','#ff9f0a'],['🚪 Break – Wand öffnet sich','#30d158'],
     ['⬜ Silber: Mehrfachtreffer','#aaa'],['🟡 Gold: unzerstörbar','#b8860b'],
     ['👾 Gegner ab Lv 2','#ff6b82'],
     ['🕷️ Crawler ab Lv 3 – frisst Blöcke!','#00e5ff'],
     ['⚡ HYPER: Gauge füllen → X / 3×Tap = Laserstrahl!','#ffd60a'],
     ['💀 Boss DOH ab Lv 13 – nur Gesicht trifft!','#bf5af2'],
     ['💰 Münzen fangen für Bonuspunkte!','#ffd60a'],
    ].forEach(([t,c],i)=>{ctx.fillStyle=c;ctx.fillText(t,W/2,112+i*20);});
    ctx.fillStyle='#4da6ff';ctx.font='15px Courier New';
    ctx.fillText('Tippen / SPACE zum Starten',W/2,H-30);
    const sb=SHOP_BTN;
    ctx.fillStyle='rgba(255,214,10,0.12)';ctx.strokeStyle='#ffd60a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(sb.x,sb.y,sb.w,sb.h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd60a';ctx.font='bold 13px Courier New';ctx.textAlign='center';
    ctx.shadowColor='#ffd60a';ctx.shadowBlur=8;
    ctx.fillText('🛍 SKIN SHOP',W/2,sb.y+20);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,214,10,0.5)';ctx.font='10px Courier New';
    ctx.fillText(`🪙 ${_wallet} Münzen`,W/2,sb.y+sb.h+14);
  }
  if(s.phase==='dead'){
    if(s.deadCause==='boss'){
      // ── Boss-bullet death screen ──
      const t=performance.now();
      const pulse=0.55+Math.sin(t*0.004)*0.1;
      ctx.fillStyle=`rgba(60,0,0,${pulse})`;ctx.fillRect(0,0,W,H);
      const iconPulse=Math.sin(t*0.008)*0.4+0.6;
      ctx.font=`${Math.floor(36+iconPulse*6)}px Courier New`;
      ctx.fillStyle=`rgba(255,80,0,${iconPulse})`;
      ctx.fillText('💥',W/2,H/2-52);
      ctx.shadowColor='#ff4400';ctx.shadowBlur=18;
      ctx.fillStyle='#ff5522';ctx.font='bold 22px Courier New';
      ctx.fillText('VON DOH ERSCHOSSEN!',W/2,H/2-12);
      ctx.shadowBlur=0;
      ctx.fillStyle='#cc6644';ctx.font='12px Courier New';
      ctx.fillText('Der Boss zeigt keine Gnade...',W/2,H/2+16);
      if(Math.floor(t/500)%2===0){
        ctx.fillStyle='#ff9f0a';ctx.font='bold 13px Courier New';
        ctx.fillText('Tippen zum Weiterspielen',W/2,H/2+44);
      }
    } else {
      // ── Normal ball-lost screen ──
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,H/2-48,W,96);
      ctx.fillStyle='#ff2d55';ctx.font='bold 24px Courier New';ctx.fillText('BALL VERLOREN!',W/2,H/2-8);
      ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen zum Weiterspielen',W/2,H/2+26);
    }
  }
  if(s.phase==='win_boss'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#bf5af2';ctx.font='bold 26px Courier New';ctx.fillText('⚠ BOSS NAHT! ⚠',W/2,H/2-40);
    ctx.fillStyle='#ff2d55';ctx.font='bold 20px Courier New';ctx.fillText('D O H',W/2,H/2);
    ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen zum Kampf!',W/2,H/2+40);
  }
  if(s.phase==='bossdead'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd60a';ctx.font='bold 28px Courier New';ctx.fillText('DOH BESIEGT! 🏆',W/2,H/2-30);
    ctx.fillStyle='#30d158';ctx.font='bold 15px Courier New';ctx.fillText(`+${s.lives*1000} Leben-Bonus!`,W/2,H/2+10);
    ctx.fillStyle='#4da6ff';ctx.font='13px Courier New';ctx.fillText('Tippen für nächstes Level',W/2,H/2+45);
  }
  if(s.phase==='win'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,H/2-62,W,124);
    ctx.fillStyle='#30d158';ctx.font='bold 22px Courier New';ctx.fillText('LEVEL GESCHAFFT! 🎉',W/2,H/2-22);
    ctx.fillStyle='#ffd60a';ctx.font='bold 14px Courier New';
    ctx.fillText(`❤️ x${s.lives} Bonus: +${s.lifeBonus||0} Punkte`,W/2,H/2+8);
    ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen für Level '+(s.level+1),W/2,H/2+34);
  }
  if(s.phase==='gameover'){
    ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff2d55';ctx.font='bold 34px Courier New';ctx.fillText('GAME OVER',W/2,H/2-28);
    ctx.fillStyle='#fff';ctx.font='17px Courier New';ctx.fillText('Score: '+s.score,W/2,H/2+8);
    ctx.fillStyle='#4da6ff';ctx.font='13px Courier New';ctx.fillText('Tippen zum Neustart',W/2,H/2+42);
  }

  // ── Skin Shop overlay ──────────────────────────────────────
  if(s.phase==='shop'){
    const now2=performance.now();
    ctx.fillStyle='rgba(5,5,18,0.97)';ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#ffd60a';ctx.shadowBlur=16;
    ctx.fillStyle='#ffd60a';ctx.font='bold 20px Courier New';ctx.textAlign='center';
    ctx.fillText('🛍  SKIN SHOP',W/2,30);
    ctx.shadowBlur=0;
    ctx.fillStyle='#888';ctx.font='11px Courier New';
    ctx.fillText(`Guthaben:`,W/2-20,52);
    ctx.fillStyle='#ffd60a';ctx.font='bold 11px Courier New';
    ctx.fillText(`🪙 ${_wallet}`,W/2+34,52);
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(8,60);ctx.lineTo(W-8,60);ctx.stroke();
    const cardW=234,cardH=78,colGap=6,rowGap=6;
    SKIN_IDS.forEach((id,i)=>{
      const skin=SKINS[id];
      const col=i%2,row=Math.floor(i/2);
      const cx=6+col*(cardW+colGap);
      const cy=66+row*(cardH+rowGap);
      const isOwned=_owned.includes(id);
      const isEq=_equipped===id;
      const canBuy=_wallet>=skin.price&&!isOwned;
      ctx.fillStyle=isEq?'rgba(255,214,10,0.08)':isOwned?'rgba(48,209,88,0.06)':'rgba(255,255,255,0.04)';
      ctx.strokeStyle=isEq?'#ffd60a':isOwned?'rgba(48,209,88,0.5)':'rgba(255,255,255,0.1)';
      ctx.lineWidth=isEq?1.5:1;
      ctx.beginPath();ctx.roundRect(cx,cy,cardW,cardH,8);ctx.fill();ctx.stroke();
      const pg2=ctx.createLinearGradient(cx+8,0,cx+90,0);
      pg2.addColorStop(0,skin.col[0]);pg2.addColorStop(0.5,skin.col[1]);pg2.addColorStop(1,skin.col[2]);
      ctx.fillStyle=pg2;ctx.shadowColor=skin.glow;ctx.shadowBlur=isEq?10:5;
      ctx.beginPath();ctx.roundRect(cx+8,cy+cardH/2-5,82,10,4);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle=isEq?'#ffd60a':'#eee';ctx.font='bold 11px Courier New';ctx.textAlign='left';
      ctx.fillText(skin.name,cx+98,cy+22);
      if(isEq){ctx.fillStyle='#ffd60a';ctx.font='9px Courier New';ctx.fillText('✦ EQUIPPED',cx+98,cy+38);}
      else if(isOwned){ctx.fillStyle='#30d158';ctx.font='9px Courier New';ctx.fillText('✓ OWNED',cx+98,cy+38);}
      else{ctx.fillStyle=canBuy?'#ffd60a':'#555';ctx.font='10px Courier New';ctx.fillText(`🪙 ${skin.price}`,cx+98,cy+38);}
      const btnX=cx+cardW-66,btnY=cy+cardH/2-15,btnW=58,btnH=30;
      if(isEq){
        ctx.fillStyle='rgba(255,214,10,0.18)';ctx.strokeStyle='#ffd60a';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#ffd60a';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('ON',btnX+btnW/2,btnY+19);
      } else if(isOwned){
        ctx.fillStyle='rgba(48,209,88,0.18)';ctx.strokeStyle='#30d158';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#30d158';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('EQUIP',btnX+btnW/2,btnY+19);
      } else if(canBuy){
        const bp=0.8+Math.sin(now2*0.005+i)*0.2;
        ctx.fillStyle=`rgba(255,214,10,${0.15*bp})`;ctx.strokeStyle=`rgba(255,214,10,${bp})`;ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle=`rgba(255,214,10,${bp})`;ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('BUY',btnX+btnW/2,btnY+19);
      } else {
        ctx.fillStyle='rgba(80,80,80,0.15)';ctx.strokeStyle='#333';ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#444';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText(`🪙${skin.price}`,btnX+btnW/2,btnY+19);
      }
    });
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(8,H-44,96,28,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#aaa';ctx.font='bold 11px Courier New';ctx.textAlign='center';
    ctx.fillText('← ZURÜCK',56,H-26);
  }

  // ── Sound settings button (always visible) ───────────────────
  {
    const {x,y,r}=SFX_BTN;
    ctx.save();
    ctx.shadowColor='#4da6ff';ctx.shadowBlur=settingsOpen?12:0;
    ctx.fillStyle=settingsOpen?'rgba(77,166,255,0.22)':'rgba(255,255,255,0.07)';
    ctx.strokeStyle=settingsOpen?'#4da6ff':'rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(_sfxMute?'🔇':'🔊',x,y);
    ctx.textBaseline='alphabetic';ctx.restore();
  }

  // ── Sound settings overlay ────────────────────────────────────
  if(settingsOpen){
    const p=SFX_PANEL,cx2=p.x+p.w/2;
    ctx.save();
    ctx.fillStyle='rgba(4,6,24,0.95)';ctx.strokeStyle='rgba(77,166,255,0.45)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,12);ctx.fill();ctx.stroke();
    ctx.shadowColor='#4da6ff';ctx.shadowBlur=18;
    ctx.fillStyle='#fff';ctx.font='bold 14px Courier New';ctx.textAlign='center';
    ctx.fillText('SOUND SETTINGS',cx2,p.y+24);ctx.shadowBlur=0;
    // Volume row
    const vol=_sfxMute?0:Math.round(_sfxVol*100);
    ctx.fillStyle='#888';ctx.font='10px Courier New';ctx.textAlign='left';
    ctx.fillText('VOLUME',p.x+24,p.y+52);
    ctx.fillStyle='#ccc';ctx.textAlign='right';
    ctx.fillText((_sfxMute?'MUTED':vol+'%'),p.x+p.w-24,p.y+52);
    // Slider track
    const bx=p.x+24,by=p.y+62,bw=p.w-48,bh=5;
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.fill();
    // Filled
    const fill=_sfxMute?0:_sfxVol;
    ctx.fillStyle=_sfxMute?'#333':'#4da6ff';ctx.beginPath();ctx.roundRect(bx,by,bw*fill,bh,3);ctx.fill();
    // Handle
    const hx=bx+bw*fill;
    ctx.shadowColor='#4da6ff';ctx.shadowBlur=_sfxMute?0:8;
    ctx.fillStyle=_sfxMute?'#555':'#fff';ctx.beginPath();ctx.arc(hx,by+bh/2,7,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Mute toggle button
    const muteY=p.y+112,btnW=152,btnH=28;
    ctx.fillStyle=_sfxMute?'rgba(255,45,85,0.18)':'rgba(48,209,88,0.14)';
    ctx.strokeStyle=_sfxMute?'#ff2d55':'#30d158';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.roundRect(cx2-btnW/2,muteY-btnH/2,btnW,btnH,6);ctx.fill();ctx.stroke();

    ctx.fillText(_sfxMute?'🔇  MUTED  — tap to unmute':'🔊  ON  — tap to mute',cx2,muteY+4);

  ctx.restore();
}

// ── DEV PANEL ─────────────────────────────────────────────────
const DEV_MAX_LEVEL = 60;
function devJumpLevel(lv){
  lv=Math.max(1,lv);
  const px=st.paddle.x,sc=st.score;
  st=initState(lv); st.paddle.x=px; st.score=sc; st.lives=5;
  if(lv%13===0){ st.bricks=[]; st.boss=spawnBoss(); SFX.bossRoar(); }
  st.phase='idle'; devUpdateInfo(); devHighlightActive();
}
function devGivePU(type){ applyPU(type); devUpdateInfo(); }
function devFillHyper(){ st.hyper=st.hyperMax; devUpdateInfo(); }
function devUnlockAllSkins(){
  _saveOwned(SKIN_IDS.slice());
  _saveWallet(999);
}
let godMode=false;
function devGodMode(){
  godMode=!godMode;
  document.querySelector('[onclick="devGodMode()"]').classList.toggle('active',godMode);
  document.querySelector('[onclick="devGodMode()"]').textContent=godMode?'🛡 God Mode ON':'🛡 God Mode';
}
function devKillAll(){ st.bricks.forEach(b=>{ if(b.type!=='gold') b.alive=false; }); }
function devSpawnBoss(){
  const lv=Math.max(st.level,13),px=st.paddle.x,sc=st.score;
  st=initState(lv); st.paddle.x=px; st.score=sc; st.lives=5;
  st.bricks=[]; st.boss=spawnBoss(); st.phase='idle';
  SFX.bossRoar(); devUpdateInfo(); devHighlightActive();
}
function devBurstBoss(){
  const b=st.boss;
  if(b&&b.alive&&!b.entering&&!b.dying){
    b.burstMode=true;
    b.hp=Math.min(b.hp,Math.floor(b.maxHp*0.5)-1);
    SFX.bossRoar();
  }
}
function devEnrageBoss(){
  const b=st.boss;
  if(b&&b.alive&&!b.entering&&!b.dying&&!b.transforming&&!b.enrageMode){
    b.burstMode=true;
    b.transforming=true;
    b.transformProgress=0;
    b.hp=Math.min(b.hp,Math.floor(b.maxHp*0.25)-1);
    SFX.bossRoar();
  }
}
function devKillBoss(){
  const b=st.boss;
  if(b&&b.alive&&!b.dying){
    b.alive=false; b.dying=true; b.dyingTimer=210; b.dyingExpTimer=8;
    SFX.bossDie();
  }
}
function devUpdateInfo(){
  document.getElementById('di-lv').textContent=st.level;
  document.getElementById('di-lv2').textContent=st.lives;
  document.getElementById('di-b').textContent=st.balls.length;
  document.getElementById('di-h').textContent=Math.round(st.hyper)+'/'+st.hyperMax;
  document.getElementById('di-ph').textContent=st.phase;
}
function devHighlightActive(){
  document.querySelectorAll('.lvlbtn').forEach(btn=>{
    btn.classList.toggle('active',parseInt(btn.dataset.lv)===st.level);
  });
}
(function(){
  const grid=document.getElementById('lvl-grid');
  for(let i=1;i<=DEV_MAX_LEVEL;i++){
    const btn=document.createElement('button');
    btn.className='devbtn lvlbtn'; btn.dataset.lv=i;
    btn.textContent=i%13===0?i+'👾':i;
    btn.onclick=(lv=>()=>devJumpLevel(lv))(i);
    grid.appendChild(btn);
  }
})();
setInterval(()=>{
  if(godMode&&st.phase==='playing'){
    if(st.balls.length===0) st.balls=[makeBall(st.level,st.paddle.x+st.paddle.w/2,PY-BR-2)];
    if(st.lives<1) st.lives=1;
  }
  devUpdateInfo(); devHighlightActive();
},200);

// ── Main loop (fixed timestep) ────────────────────────────────
let lastTs=null,accum=0;
function loop(ts){
  if(lastTs===null){lastTs=ts;accum=0;}
  let delta=ts-lastTs; lastTs=ts;
  if(delta>100)delta=100; // prevent spiral of death
  accum+=delta;
  while(accum>=STEP){tick();accum-=STEP;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
