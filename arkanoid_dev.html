<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arkanoid – DEV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05050f;display:flex;align-items:flex-start;justify-content:center;
  min-height:100vh;touch-action:none;overflow-x:hidden;overflow-y:auto;gap:16px;padding:16px 0}
canvas{border-radius:10px;border:1px solid rgba(77,166,255,.2);
  box-shadow:0 0 30px rgba(77,166,255,.06);display:block}
#devpanel{
  display:flex;flex-direction:column;gap:8px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(77,166,255,.2);
  border-radius:10px;padding:12px;min-width:160px;
  font-family:'Courier New',monospace;color:#fff;
  align-self:flex-start;margin-top:20px;
}
#devpanel h3{color:#ffd60a;font-size:12px;letter-spacing:2px;margin-bottom:4px;text-align:center}
#devpanel .section{color:#4da6ff;font-size:10px;letter-spacing:1px;margin:6px 0 3px}
.devbtn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-family:'Courier New',monospace;font-size:11px;
  padding:5px 8px;border-radius:5px;cursor:pointer;text-align:left;
  transition:background .15s;width:100%;
}
.devbtn:hover{background:rgba(255,255,255,.15);border-color:#4da6ff}
.devbtn.active{background:rgba(77,166,255,.2);border-color:#4da6ff;color:#4da6ff}
.devbtn.warn{border-color:#ff9f0a;color:#ff9f0a}
.devbtn.warn:hover{background:rgba(255,159,10,.15)}
.devbtn.danger{border-color:#ff2d55;color:#ff2d55}
.devbtn.danger:hover{background:rgba(255,45,85,.15)}
#lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-height:150px;overflow-y:auto}
.lvlbtn{padding:3px 2px;font-size:10px;text-align:center}
#lv-custom{display:flex;gap:4px;margin-top:4px}
#lv-input{width:52px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-family:'Courier New',monospace;font-size:11px;padding:4px 6px;border-radius:4px}
#dev-info{font-size:10px;color:#555;border-top:1px solid rgba(255,255,255,.08);
  padding-top:6px;margin-top:4px;line-height:1.6}
#dev-info span{color:#aaa}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="devpanel">
  <h3>⚙ DEV PANEL</h3>
  <div class="section">JUMP TO LEVEL</div>
  <div id="lvl-grid"></div>
  <div id="lv-custom">
    <input id="lv-input" type="number" min="1" placeholder="Lv#">
    <button class="devbtn" style="flex:1" onclick="devJumpLevel(parseInt(document.getElementById('lv-input').value)||1)">Go →</button>
  </div>
  <div class="section">POWER-UPS</div>
  <button class="devbtn warn" onclick="devGivePU('WIDE')">↔️ Wide</button>
  <button class="devbtn warn" onclick="devGivePU('LASER')">🔫 Laser</button>
  <button class="devbtn warn" onclick="devGivePU('CATCH')">🧲 Catch</button>
  <button class="devbtn warn" onclick="devGivePU('MULTI')">⚡ Multiball</button>
  <button class="devbtn warn" onclick="devGivePU('SLOW')">🐢 Slow</button>
  <button class="devbtn warn" onclick="devGivePU('LIFE')">❤️ +Life</button>
  <button class="devbtn warn" onclick="devGivePU('BREAK')">🚪 Break</button>
  <div class="section">CHEATS</div>
  <button class="devbtn" onclick="devFillHyper()">⚡ Fill Hyper</button>
  <button class="devbtn" onclick="devUnlockAllSkins()">🎨 All Skins + 999🪙</button>
  <button class="devbtn" onclick="devGodMode()">🛡 God Mode</button>
  <button class="devbtn danger" onclick="devKillAll()">💀 Kill All Bricks</button>
  <button class="devbtn danger" onclick="devSpawnBoss()">👾 Spawn Boss Now</button>
  <button class="devbtn danger" onclick="devBurstBoss()">⚡ Boss Burst Mode</button>
  <button class="devbtn danger" onclick="devEnrageBoss()">🔥 Boss Enrage Mode</button>
  <button class="devbtn danger" onclick="devKillBoss()">☠ Kill Boss</button>
  <div id="dev-info">
    LVL <span id="di-lv">-</span> &nbsp; LIVES <span id="di-lv2">-</span><br>
    BALLS <span id="di-b">-</span> &nbsp; HYPER <span id="di-h">-</span><br>
    PHASE <span id="di-ph">-</span>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

// ── Constants ─────────────────────────────────────────────────
const W=480,H=520,PH=12,PY=478,BR=7;
const BASE_SPEED=6.0,SPD_INC=0.28,MAX_SPD=7.5,MAX_SPD_2=9.5,SLOW_MULT=0.55;
const STEP=1000/60;

// ── Responsive canvas ─────────────────────────────────────────
function resize(){
  const dpr=window.devicePixelRatio||1;
  const r=Math.min((innerWidth-8)/480,(innerHeight-8)/520);
  const cssW=Math.floor(480*r),cssH=Math.floor(520*r);
  canvas.width=Math.floor(cssW*dpr); canvas.height=Math.floor(cssH*dpr);
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
}
resize(); window.addEventListener('resize',()=>{resize();});
const SC=()=>canvas.width/480;
const CSS_SC=()=>parseFloat(canvas.style.width)/480;


// ── Starfield (generated once, animated in draw) ──────────────
const STARS=Array.from({length:70},()=>({
  x:Math.random()*480, y:Math.random()*520,
  r:Math.random()<0.6?0.6:Math.random()<0.88?1.1:1.8,
  base:0.2+Math.random()*0.55,
  flicker:Math.random()*Math.PI*2,
  fspd:0.018+Math.random()*0.038,
}));

// ── Color palettes ────────────────────────────────────────────
const COLORS=[
  ['#ff2d55','#ff6b82'],['#ff9f0a','#ffbf4d'],['#ffd60a','#ffe566'],
  ['#30d158','#6ee89a'],['#0a84ff','#4da6ff'],['#bf5af2','#d48aff'],
];
const PU={
  WIDE: {emoji:'↔️', label:'BREIT',    color:'#4da6ff',bg:'#0a2040',dur:8000},
  SLOW: {emoji:'🐢', label:'LANGSAM',  color:'#30d158',bg:'#0a2014',dur:7000},
  MULTI:{emoji:'⚡', label:'MULTIBALL',color:'#ffd60a',bg:'#201800',dur:null},
  LIFE: {emoji:'❤️', label:'+LEBEN',   color:'#ff2d55',bg:'#200814',dur:null},
  LASER:{emoji:'🔫', label:'LASER',    color:'#bf5af2',bg:'#180a28',dur:7000},
  CATCH:{emoji:'🧲', label:'CATCH',    color:'#ff9f0a',bg:'#201000',dur:10000},
  BREAK:{emoji:'🚪', label:'BREAK',    color:'#30d158',bg:'#0a2014',dur:null},
  TINY: {emoji:'😬', label:'MINI!',    color:'#ff6b82',bg:'#200808',dur:6000},
};
const PU_KEYS=Object.keys(PU);

// ── Skin shop ─────────────────────────────────────────────────
const SKINS={
  classic: {name:'CLASSIC',  price:0,  col:['#4da6ff','#a0d4ff','#4da6ff'], glow:'#4da6ff'},
  fire:    {name:'FIRE',     price:8,  col:['#ff4400','#ffaa00','#ff4400'], glow:'#ff6600'},
  ice:     {name:'ICE',      price:12, col:['#00ddff','#aaeeff','#00ddff'], glow:'#00ccff'},
  toxic:   {name:'TOXIC',    price:18, col:['#22ff44','#aaff22','#22ff44'], glow:'#00ff44'},
  shadow:  {name:'SHADOW',   price:25, col:['#554477','#9977cc','#554477'], glow:'#8855bb'},
  gold:    {name:'GOLD',     price:35, col:['#b8860b','#ffe566','#b8860b'], glow:'#ffd60a'},
  galaxy:  {name:'GALAXY',   price:50, col:['#7b2ff7','#e040fb','#7b2ff7'], glow:'#bf5af2'},
  boss:    {name:'BOSS RED', price:70, col:['#cc1a00','#ff5522','#cc1a00'], glow:'#ff2d55'},
};
const SKIN_IDS=Object.keys(SKINS);
const SHOP_BTN={x:160,y:448,w:160,h:30};
let _wallet=parseInt(localStorage.getItem('ark_wallet')||'0');
let _owned=(()=>{try{const a=JSON.parse(localStorage.getItem('ark_skins'));return Array.isArray(a)?a:['classic'];}catch{return['classic'];}})();
let _equipped=localStorage.getItem('ark_equipped')||'classic';
if(!SKINS[_equipped])_equipped='classic';
function _saveWallet(n){_wallet=Math.max(0,n);localStorage.setItem('ark_wallet',_wallet);}
function _saveOwned(a){_owned=a;localStorage.setItem('ark_skins',JSON.stringify(a));}
function _saveEquipped(id){_equipped=id;localStorage.setItem('ark_equipped',id);}
let _sfxVol=parseFloat(localStorage.getItem('ark_sfx_vol')||'0.8');
let _sfxMute=localStorage.getItem('ark_sfx_mute')==='1';
let MASTER_GAIN=null;
function _applySoundVol(){if(MASTER_GAIN)MASTER_GAIN.gain.setValueAtTime(_sfxMute?0:_sfxVol,AC.currentTime);}
function _saveSoundSettings(){localStorage.setItem('ark_sfx_vol',_sfxVol);localStorage.setItem('ark_sfx_mute',_sfxMute?'1':'0');}
function handleShopClick(x,y){
  if(x>=8&&x<=104&&y>=H-44&&y<=H-16){st.phase='idle';return;}
  const wallet=_wallet;
  SKIN_IDS.forEach((id,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const cx=6+col*240, cy=72+row*84;
    const btnX=cx+240-68, btnY=cy+84/2-16, btnW=60, btnH=32;
    if(x>=btnX&&x<=btnX+btnW&&y>=btnY&&y<=btnY+btnH){
      if(_owned.includes(id)){_saveEquipped(id);}
      else if(wallet>=SKINS[id].price){
        _saveWallet(wallet-SKINS[id].price);
        _saveOwned([..._owned,id]);
        _saveEquipped(id);
      }
    }
  });
}

// ── Level layout helpers ──────────────────────────────────────
const N=(c,p=null)=>({t:'n',c,p});
const S=(p=null)=>({t:'s',p});
const G=()=>({t:'g'});
const _=null;
const P=(c)=>({t:'p',c});

const LAYOUTS=[
  // Lv1 – gentle intro: 3 full rows, no silver (30 bricks)
  [
    [N(0),N(0),N(0),N(0),N(0,'WIDE'),N(0),N(0),N(0,'LIFE'),N(0),N(0)],
    [N(1),N(1),N(1,'SLOW'),N(1),N(1),N(1),N(1),N(1),N(1),N(1)],
    [N(2),N(2),N(2),N(2),N(2),N(2),N(2,'MULTI'),N(2),N(2),N(2)],
    [_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv2 – checkerboard: alternating bricks and gaps, silvers lurk in the grid (18N+2S)
  [
    [N(0),_,N(1),_,N(2,'WIDE'),_,N(3),_,N(4,'LIFE'),_],
    [_,N(5),_,N(0),_,N(1),_,N(2),_,N(3)],
    [N(4),_,S('SLOW'),_,N(5),_,S('MULTI'),_,N(0),_],
    [_,N(1),_,N(2),_,N(3),_,N(4),_,N(5)],
    [_,_,_,_,_,_,_,_,_,_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv3 – diamond: first shaped pattern, silver bricks throughout (14N+9S)
  [
    [_,_,_,N(3),S('WIDE'),N(3),_,_,_,_],
    [_,_,N(2),S(),N(2,'CATCH'),S(),N(2),_,_,_],
    [_,N(1),S(),N(1),S('SLOW'),N(1),S(),N(1),_,_],
    [_,_,N(2),S(),N(2),S(),N(2),_,_,_],
    [_,_,_,N(3),S('LIFE'),N(3),_,_,_,_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv4 – funnel: solid triangle pointing down, widest at top, tip at bottom (26N+4S)
  [
    [N(0),N(1),N(2),N(3),N(4,'WIDE'),N(5),N(0),N(1),N(2),N(3)],
    [_,N(4),N(5),N(0),S('LIFE'),S('SLOW'),N(1),N(5),N(4),_],
    [_,_,N(2),N(3),S('CATCH'),S('LASER'),N(4),N(2),_,_],
    [_,_,_,N(5),N(0),N(1),N(2),_,_,_],
    [_,_,_,_,N(3,'MULTI'),N(4),_,_,_,_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv5 – gold columns: gold guards on left+right, dense silver interior (31N+10S+8G)
  [
    [_,  N(0),N(1,'LASER'),N(2),S('MULTI'),S(),     N(3),N(4),N(5),   _],
    [G(),S(),  N(1),       N(2),N(3,'WIDE'),N(4),   N(5),S(), N(0),   G()],
    [G(),N(5), N(4),S('CATCH'),N(3),        N(2),   S(), N(1),N(0),   G()],
    [G(),N(0,'LIFE'),N(1), N(2),S(),        S(),    N(3),N(4),N(5,'SLOW'),G()],
    [_,  N(3), S(),  N(2), N(1),            N(0),   S('MULTI'),N(5),N(4),_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv6 – castle: gold crenellations at top, tower walls, packed floor (24N+4S+10G)
  [
    [G(),_,G(),_,G(),G(),_,G(),_,G()],
    [G(),N(0),G(),N(1),N(2),N(3),N(4),G(),N(5),G()],
    [_,N(0),_,S('WIDE'),N(1),N(2),S('CATCH'),_,N(3),_],
    [_,N(4),N(5),N(0),S('LIFE'),S('LASER'),N(1),N(2),N(3),_],
    [_,N(4),N(5),N(0),N(1),N(2),N(3),N(4),N(5),_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv7 – fortress: gold walls enclose sparse interior, reach in (12N+4S+24G)
  [
    [G(),G(),G(),G(),_,_,G(),G(),G(),G()],
    [G(),_,_,_,_,_,_,_,_,G()],
    [G(),N(2),N(1,'LIFE'),S('CATCH'),N(3),N(3),S('LASER'),N(1),N(2),G()],
    [G(),N(4),N(5),S(),N(0),N(0),S(),N(5),N(4),G()],
    [G(),_,_,_,_,_,_,_,_,G()],
    [G(),G(),G(),G(),_,_,G(),G(),G(),G()],
  ],
  // Lv8 – zipper: two rows of offset gold teeth divide the field; weave the ball through to reach the top (26N+4S+10G)
  [
    [N(0),N(1),N(2),N(3),S('WIDE'),N(4),N(5),N(0),S('LIFE'),N(1)],
    [N(2),N(3),N(4),S('CATCH'),N(5),N(0),N(1),S('LASER'),N(2),N(3)],
    [G(),_,G(),_,_,_,G(),_,G(),_],
    [_,G(),_,G(),_,_,_,G(),_,G()],
    [N(4),N(5),N(0),N(1),N(2,'MULTI'),N(3),N(4),N(5),N(0),N(1)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv9 – X shape: diagonal cross with gold centre (20N+8S+4G)
  [
    [N(5,'WIDE'),_,_,_,S(),S(),_,_,_,N(5)],
    [_,N(4),N(4),_,S('CATCH'),S(),_,N(4),N(4),_],
    [_,_,N(3),N(3),G(),G(),N(3,'MULTI'),N(3),_,_],
    [_,_,N(2),N(2),G(),G(),N(2),N(2),_,_],
    [_,N(1),N(1),_,S('LASER'),S(),_,N(1),N(1),_],
    [N(0),_,_,_,S(),S(),_,_,_,N(0,'LIFE')],
  ],
  // Lv10 – plus cross: cardinal cross (+) with gold core, silver arms (20N+8S+4G)
  [
    [_,_,_,_,N(0),N(1),_,_,_,_],
    [_,_,_,N(2),S('WIDE'),S('LIFE'),N(5),_,_,_],
    [N(0),N(1),N(2),S('LASER'),G(),G(),S('CATCH'),N(5),N(0),N(1)],
    [N(2),N(3),N(4),S(),G(),G(),S('MULTI'),N(1),N(2),N(3)],
    [_,_,_,N(4),S('SLOW'),S(),N(1),_,_,_],
    [_,_,_,_,N(2),N(3),_,_,_,_],
  ],
  // Lv11 – skull: gold eye sockets persist, silver teeth at the jaw (30N+5S+8G)
  [
    [_,N(0),N(1),N(2),N(3),N(4),N(5),N(0),N(1),_],
    [N(2),N(3),G(),G(),N(4),N(5),G(),G(),N(0),N(1)],
    [N(2),N(3),G(),G(),N(4),N(5),G(),G(),N(0),N(1)],
    [N(2),N(3),N(4),N(5),N(0),N(1),N(2),N(3),N(4),N(5)],
    [S(),N(0),S('LASER'),N(1),S('LIFE'),N(2),S('MULTI'),N(3),S('SLOW'),N(4)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv12 – dense mix: maximum pre-boss density, gold+silver storm (~40N+10S+10G)
  [
    ...[0,1,2,3,4,5].map(r=>
      Array.from({length:10},(_,c)=>({
        t:((r+c)%4===0)?'g':((r+c)%4===1)?'s':'n',
        c:(r*3+c)%6,
        p:(r===0&&c===4)?'MULTI':(r===1&&c===2)?'WIDE':(r===2&&c===7)?'LASER'
          :(r===3&&c===1)?'CATCH':(r===4&&c===8)?'SLOW':null,
      }))
    ),
  ],
  // Lv13 boss slot – bricks cleared for boss fight; arrowhead used if cycled back
  [
    [_,_,_,_,N(0),N(1),_,_,_,_],
    [_,_,_,N(2),N(3),N(4),N(5),_,_,_],
    [_,_,N(0),N(1),S('WIDE'),S('LASER'),N(2),N(3),_,_],
    [_,N(4),N(5),N(0),N(1),N(2),N(3),N(4),N(5),_],
    [N(0),N(1),N(2),S(),S('MULTI'),S('LIFE'),S(),N(3),N(4),N(5)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv14: "Wormhole Gate" — cyan portals pierce the full gold wall (1 pair)
  [
    [N(0),N(1),N(2),N(3),N(4,'WIDE'),N(5),N(0),N(1),N(2),N(3)],
    [N(4),S(),N(5),N(0),N(1),N(2),N(3),S('LASER'),N(4),N(5)],
    [P(0),G(),G(),G(),G(),G(),G(),G(),G(),P(0)],
    [N(5),N(0),S('MULTI'),N(1),N(2),N(3),N(4),S('LIFE'),N(5),N(0)],
    [N(1),N(2),N(3),N(4),N(5),N(0),N(1),N(2),N(3),N(4)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv15: "Framed" — gold border; orange portal pair tunnels through col 4
  [
    [G(),G(),G(),G(),G(),G(),G(),G(),G(),G()],
    [G(),N(1),N(2),N(3),P(1),N(4),N(3),N(2),N(1),G()],
    [G(),N(4),S('WIDE'),N(5),N(0),N(0),S('CATCH'),N(5),N(4),G()],
    [G(),N(1),N(2),S('LASER'),N(3),N(3),S('MULTI'),N(2),N(1),G()],
    [G(),N(4),N(5),S('LIFE'),P(1),N(0),S('SLOW'),N(5),N(4),G()],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv16: "Double Warp" — cyan horizontal + orange vertical; gold bands block direct paths
  [
    [N(0),N(1),N(2),N(3),P(1),N(5),N(0),N(1),N(2),N(3)],
    [N(4),S('WIDE'),N(5),G(),G(),G(),G(),N(0),S('LASER'),N(1)],
    [P(0),N(2),N(3),N(4),N(5),N(0),N(1),N(2),N(3),P(0)],
    [N(4),S(),N(5),G(),G(),G(),G(),N(0),S('MULTI'),N(1)],
    [N(2),N(3),N(4),N(5),P(1),N(1),N(2),N(3),N(4),N(5)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv17: "Pillar Bypass" — cyan at col 2, orange at col 7; skip the gold pillar zones
  [
    [N(0),N(1),N(2),N(3),N(4,'WIDE'),N(5),N(0),N(1),N(2),N(3)],
    [N(4),N(5),P(0),N(0),S('LASER'),S('CATCH'),N(1),P(1),N(2),N(3)],
    [N(4),G(),G(),N(5),N(0),N(1),N(2),G(),G(),N(3)],
    [N(4),G(),G(),N(5),N(0),N(1),N(2),G(),G(),N(3)],
    [N(4),N(5),P(0),N(0),S('MULTI'),S('LIFE'),N(1),P(1),N(2),N(3)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv18: "Concentric Rifts" — 2 portal pairs woven into the diamond rings
  [
    [_,_,_,_,N(5),N(5),_,_,_,_],
    [_,_,_,P(1),S('WIDE'),S(),N(4),_,_,_],
    [_,_,N(3),S(),N(2),N(2),S(),N(3),_,_],
    [_,P(0),S('LASER'),N(1),N(0),N(0),N(1),S('CATCH'),P(0),_],
    [N(1),S(),N(0),P(1),N(2),N(3),S('LIFE'),N(0),S(),N(1)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv19: "Scattered Rifts" — 3 portal pairs hidden in the dense field
  [
    [P(0),N(1),N(2),N(3),N(4),N(5),N(0),N(1),N(2),P(1)],
    [S(),N(4),N(5),S(),N(0),N(1),S(),N(2),N(3),S()],
    [N(4),N(5),S('WIDE'),N(0),P(2),N(2),S('LASER'),N(3),N(4),N(5)],
    [S(),N(0),N(1),S(),N(2),P(2),S('LIFE'),N(4),N(5),S()],
    [P(0),S(),N(1),N(2),S('MULTI'),S('CATCH'),N(3),N(4),S(),P(1)],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv20: "Z-Rift" — Z-banner shape with 3 portal pairs at the bends

// ── Brick factory ─────────────────────────────────────────────
function makeBricks(lv){
  const layout=LAYOUTS[(lv-1)%LAYOUTS.length];
  const bw=W/10,bh=22,bp=3,top=52,silverHits=2+Math.floor(lv/3);
  const bricks=[];
  layout.forEach((row,r)=>{
    (row||[]).forEach((cell,c)=>{
      if(!cell)return;
      const x=c*bw+bp,y=top+r*(bh+bp),w=bw-bp*2,h=bh;
      let type,color,pts,maxHits;
      if(cell.t==='g'){type='gold';  color=['#b8860b','#ffe566'];pts=0; maxHits=9999;}
      else if(cell.t==='s'){type='silver';color=['#999','#ddd']; pts=50;maxHits=silverHits;}
      else if(cell.t==='p'){const PC=[['#00e5ff','#80f4ff'],['#ff9f0a','#ffd480'],['#bf5af2','#d48aff']];type='portal';color=PC[cell.c%3];pts=0;maxHits=9999;}
      else{type='normal';color=COLORS[((cell.c||0)+6)%6];pts=(6-r)*10+10;maxHits=1;}
      bricks.push({x,y,w,h,type,color,pts,maxHits,hits:0,alive:true,pu:cell.p||null,portalColor:cell.t==='p'?cell.c%3:-1});
    });
  });
  return bricks;
}

// Spawn a crawler anchored to the bottom of a random alive brick
function spawnCrawler(bricks,lv){
  const alive=bricks.filter(b=>b.alive&&b.type!=='gold'&&b.type!=='portal');
  if(!alive.length)return null;
  const anchor=alive[Math.floor(Math.random()*alive.length)];

    type:'crawler',color:'#00e5ff',
    x:anchor.x+anchor.w/2, y:anchor.y+anchor.h, // sit on bottom of brick
    w:18,h:14,

let AC=null;
function getAC(){
  if(!AC){
    AC=new(window.AudioContext||window.webkitAudioContext)();
    MASTER_GAIN=AC.createGain();
    MASTER_GAIN.gain.setValueAtTime(_sfxMute?0:_sfxVol,AC.currentTime);
    MASTER_GAIN.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function playTone({type='square',freq=440,freq2=null,vol=0.18,attack=0.005,decay=0.08,dur=0.12,detune=0,noise=0}={}){
  try{
    const ac=getAC(), t=ac.currentTime;
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(vol,t+attack);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    gain.connect(MASTER_GAIN||ac.destination);
    const osc=ac.createOscillator();
    osc.type=type; osc.frequency.setValueAtTime(freq,t);
    osc.detune.setValueAtTime(detune,t);
    if(freq2) osc.frequency.exponentialRampToValueAtTime(freq2,t+dur);
    osc.connect(gain); osc.start(t); osc.stop(t+dur+0.02);
    if(noise>0){
      const buf=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*noise;
      const src=ac.createBufferSource(), ng=ac.createGain();
      ng.gain.setValueAtTime(vol*.6,t);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+decay*.8);
      src.buffer=buf; src.connect(ng); ng.connect(MASTER_GAIN||ac.destination); src.start(t);
    }
  }catch(e){}
}

function ballSpeed(lv){
  if(lv>13) return Math.min(MAX_SPD+(lv-13)*SPD_INC,MAX_SPD_2);
  return Math.min(BASE_SPEED+(lv-1)*SPD_INC,MAX_SPD);
}
function clampSpd(b,lv,slow){
  const t=ballSpeed(lv)*(slow?SLOW_MULT:1),sp=Math.hypot(b.vx,b.vy);
  if(!isFinite(sp)||sp<0.01){b.vx=0;b.vy=-t;return;}
  b.vx=b.vx/sp*t; b.vy=b.vy/sp*t;
}

function applyPU(type){
  const s=st,now=performance.now(),d=PU[type];
  if(!d)return;
  if(type==='WIDE'){s.fx.WIDE=now+d.dur;s.fx.TINY=0;s.paddle.w=130;}
  else if(type==='TINY'){s.fx.TINY=now+d.dur;s.fx.WIDE=0;s.paddle.w=44;}
  else if(type==='SLOW'){s.fx.SLOW=now+d.dur;s.balls.forEach(b=>clampSpd(b,s.level,true));}
  else if(type==='LASER'){s.fx.LASER=now+d.dur;s.laserOn=true;}
  else if(type==='CATCH'){s.fx.CATCH=now+d.dur;}
  else if(type==='LIFE'){s.lives=Math.min(s.lives+1,5);}
  else if(type==='BREAK'){if(s.level%13!==0){s.wallBreak=true;s.wallBreakTimer=now+4000;}}
  else if(type==='MULTI'){
    const extras=[];
    s.balls.forEach(b=>{
      const sp=ballSpeed(s.level);
      [.8,-.8].forEach(off=>{const a=Math.atan2(b.vy,b.vx)+off;
        extras.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,caught:false,catchOff:0,portalCooldown:0});});
    });
    s.balls=[...s.balls,...extras].slice(0,6);
  }
  spawnFX(s.paddle.x+s.paddle.w/2,PY,d.color,14);
}

// ── Launch / restart ──────────────────────────────────────────
function launch(){
  const s=st;
  if(s.phase==='idle'||s.phase==='dead'){
    s.deadCause=null;
    let rel=false;
    s.balls.forEach(b=>{if(b.caught){b.caught=false;rel=true;}});
    if(!rel) s.balls=[makeBall(s.level,s.paddle.x+s.paddle.w/2,PY-BR-2)];
    s.phase='playing';
  } else if(s.phase==='win'||s.phase==='win_boss'){
    const lv=s.level+1,px=s.paddle.x,sc=s.score;
    st=initState(lv); st.paddle.x=px; st.score=sc;
    // Boss level: skip bricks, spawn boss
    if(lv%13===0){
      st.bricks=[];
      st.boss=spawnBoss();
      SFX.bossRoar();
    }
  } else if(s.phase==='bossdead'){
    // After defeating boss, continue with next level
    const lv=s.level+1,px=s.paddle.x,sc=s.score+s.lives*1000;
    st=initState(lv); st.paddle.x=px; st.score=sc;
  } else if(s.phase==='gameover'){
    st=initState(); paused=false; // defensive: dev panel can force gameover outside tick()
  } else if(s.phase==='playing'){
    s.balls.forEach(b=>{if(b.caught)b.caught=false;});
  }
}
function shootLaser(){

  const cx=s.paddle.x+s.paddle.w/2;

  if(dx*dx+dy*dy<=(bd.r+4)*(bd.r+4)){
    settingsOpen=!settingsOpen;
    if(settingsOpen&&st.phase==='playing'&&!paused)paused=true;
    else if(!settingsOpen&&paused)paused=false;
    return;
  }
  if(settingsOpen){handleSFXPanelClick(cx,cy);return;}
  if(paused){togglePause();return;}
  if(st.phase==='shop'){handleShopClick(cx,cy);return;}
  if(st.phase==='idle'){
    if(cx>=SHOP_BTN.x&&cx<=SHOP_BTN.x+SHOP_BTN.w&&cy>=SHOP_BTN.y&&cy<=SHOP_BTN.y+SHOP_BTN.h){
      st.phase='shop';return;
    }
  }
  launch();
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  canvasClick((e.clientX-r.left)/CSS_SC(),(e.clientY-r.top)/CSS_SC());
});
document.addEventListener('touchstart',e=>{
  e.preventDefault();
  const touch=e.touches[0],r=canvas.getBoundingClientRect();
  const tx=(touch.clientX-r.left)/CSS_SC();
  st.targetX=tx;
  if(touch.clientY>=r.top&&touch.clientY<=r.bottom)
    canvasClick(tx,(touch.clientY-r.top)/CSS_SC());
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();

},{passive:false});
document.addEventListener('mousemove',e=>{

});
document.addEventListener('touchend',e=>{
  const now=performance.now();
  if(now-lastTap<300){
    tapCount++;
    if(tapCount===1) shootLaser();
    if(tapCount>=2){ fireHyper(); tapCount=0; }
  } else { tapCount=0; }
  lastTap=now;
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(settingsOpen){settingsOpen=false;if(paused&&st.phase==='playing')paused=false;return;}
    if(st.phase==='shop'){st.phase='idle';return;}
    if(paused){togglePause();return;}
  }
  if(e.key==='p'||e.key==='P'){togglePause();return;}
  if(e.key===' '){e.preventDefault();if(paused){togglePause();return;}launch();}
  if(e.key==='ArrowLeft') st.targetX=(st.paddle.x+st.paddle.w/2)-30;
  if(e.key==='ArrowRight')st.targetX=(st.paddle.x+st.paddle.w/2)+30;
  if(e.key==='z'||e.key==='Z') shootLaser();
  if(e.key==='x'||e.key==='X') fireHyper();
});

function handleSFXPanelClick(cx,cy){
  const p=SFX_PANEL,barX=p.x+24,barY=p.y+68,barW=p.w-48;
  if(cx>=barX-4&&cx<=barX+barW+4&&cy>=barY-10&&cy<=barY+18){
    _sfxVol=Math.max(0,Math.min(1,(cx-barX)/barW));
    _sfxMute=false;_applySoundVol();_saveSoundSettings();return;
  }
  const muteY=p.y+112;
  if(cx>=p.x+24&&cx<=p.x+p.w-24&&cy>=muteY-14&&cy<=muteY+14){
    _sfxMute=!_sfxMute;_applySoundVol();_saveSoundSettings();return;
  }
  if(cx<p.x||cx>p.x+p.w||cy<p.y||cy>p.y+p.h){
    settingsOpen=false;if(paused&&st.phase==='playing')paused=false;
  }
}

  if(cx>=barX-4&&cx<=barX+barW+4&&cy>=barY-10&&cy<=barY+18){
    _sliderDrag=true;
    _sfxVol=Math.max(0,Math.min(1,(cx-barX)/barW));
    _sfxMute=false;_applySoundVol();_saveSoundSettings();
  }
});

  _applySoundVol();_saveSoundSettings();
});
canvas.addEventListener('pointerup',()=>{_sliderDrag=false;});

// ── Fixed-timestep tick ───────────────────────────────────────
function tick(){
  const s=st;
  if(paused)return;
  if(s.phase!=='playing'){s.coins=[];s.floaters=[];s.skinParts=[];s.ballTrail=[];s.shadowTrail=[];return;}
  const now=performance.now();

  // Expire effects
  for(const[k,v]of Object.entries(s.fx)){
    if(v&&now>v){
      if(k==='WIDE'||k==='TINY')s.paddle.w=80;
      if(k==='LASER')s.laserOn=false;
      if(k==='SLOW')s.balls.forEach(b=>clampSpd(b,s.level,false));
      s.fx[k]=0;
    }
  }
  if(s.wallBreak&&now>s.wallBreakTimer)s.wallBreak=false;

  const PW=s.paddle.w;
  const isSlow=!!(s.fx.SLOW&&s.fx.SLOW>now);
  const isCatch=!!(s.fx.CATCH&&s.fx.CATCH>now);
  const isStunned=s.stunTimer>0;
  if(isStunned) s.stunTimer--;

  // Paddle – dramatically slower when stunned
  const followSpeed = isStunned ? 0.025 : 0.18;
  s.paddle.x+=(s.targetX-(s.paddle.x+PW/2))*followSpeed;
  s.paddle.x=Math.max(0,Math.min(W-PW,s.paddle.x));

  // Enemy spawning (flyers)
  if(s.level>=2){
    s.enemyTimer--;
    if(s.enemyTimer<=0&&s.enemies.filter(e=>e.type!=='crawler').length<1+Math.floor(s.level/3)){
      s.enemies.push(spawnEnemy(s.level));
      s.enemyTimer=Math.max(300-s.level*15,140)+Math.floor(Math.random()*100);
    }
  }
  // Crawler spawning (lv3+)
  if(s.level>=3){
    s.crawlerTimer--;
    if(s.crawlerTimer<=0&&s.enemies.filter(e=>e.type==='crawler').length<1){
      const c=spawnCrawler(s.bricks,s.level);
      if(c) s.enemies.push(c);
      s.crawlerTimer=Math.max(600-s.level*20,300)+Math.floor(Math.random()*150);
    }
  }

  // Enemy movement & shooting
  for(let i=s.enemies.length-1;i>=0;i--){
    const e=s.enemies[i];
    if(!e.alive){s.enemies.splice(i,1);continue;}
    e.phase+=.04;

    if(e.type==='crawler'){
      // Find the brick we're anchored to
      const ab=e.anchorBrick;
      if(!ab||!ab.alive||ab.type==='gold'){
        // Try to land on brick below current position
        const bw=W/10,bh=22,bp=3,top=52;
        let found=null;
        for(const bk of s.bricks){
          if(!bk.alive||bk.type==='gold'||bk.type==='portal')continue;
          if(e.x>bk.x&&e.x<bk.x+bk.w&&Math.abs(e.y-(bk.y+bk.h))<4){found=bk;break;}
        }
        if(found){e.anchorBrick=found;e.y=found.y+found.h;}
        else{
          // Fall down and die if off screen
          e.y+=2; if(e.y>H+20){e.alive=false;} continue;
        }
      }

      // Walk along the bottom edge of the anchor brick
      e.x+=e.dir*e.spd;
      e.y=e.anchorBrick.y+e.anchorBrick.h; // stick to brick bottom

      // Check if we've walked off the edge of the current brick
      const ab2=e.anchorBrick;
      if(e.x-e.w/2>ab2.x+ab2.w||e.x+e.w/2<ab2.x){
        // Look for adjacent brick in same row to hop to
        let next=null;
        for(const bk of s.bricks){
          if(!bk.alive||bk===ab2||bk.type==='gold')continue;
          // Same row (y within 2px)
          if(Math.abs(bk.y-ab2.y)<2){
            if(e.dir>0&&bk.x>=ab2.x+ab2.w-2&&bk.x<ab2.x+ab2.w+bk.w){next=bk;break;}
            if(e.dir<0&&bk.x+bk.w<=ab2.x+2&&bk.x+bk.w>ab2.x-bk.w){next=bk;break;}
          }
        }
        if(next){e.anchorBrick=next;}
        else{e.dir*=-1;} // reverse at dead end
      }
      // Wall bounce
      if(e.x<e.w/2){e.x=e.w/2;e.dir=1;}
      if(e.x>W-e.w/2){e.x=W-e.w/2;e.dir=-1;}

      // Eat the brick over time
      e.eatTimer--;
      if(e.eatTimer<=0&&e.anchorBrick&&e.anchorBrick.alive&&e.anchorBrick.type!=='gold'){
        e.anchorBrick.hits++;
        e.eatTimer=150;
        spawnFX(e.x,e.y,'#00e5ff',5);
        if(e.anchorBrick.hits>=e.anchorBrick.maxHits){
          const bk=e.anchorBrick;
          bk.alive=false; s.score+=bk.pts;
          spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
          if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y+bk.h/2,w:28,h:18,vy:2.2,type:bk.pu});
          e.anchorBrick=null;
        }
      }

      // Shoot straight down toward paddle
      e.shootTimer--;
      if(e.shootTimer<=0){
        s.eLasers.push({x:e.x,y:e.y+e.h,w:3,h:12,vy:5+s.level*.2});
        e.shootTimer=90+Math.floor(Math.random()*90);
        SFX.enemyShoot();
      }

      // Hit paddle directly → stun player
      if(e.y+e.h>PY&&e.y<PY+PH&&e.x+e.w/2>s.paddle.x&&e.x-e.w/2<s.paddle.x+PW){
        spawnFX(e.x,e.y,'#00e5ff',18);e.alive=false;
        if(s.stunTimer<=0) SFX.stun();
        s.stunTimer=300; // 5 seconds at 60fps
      }

    } else {
      // Existing flyer movement
      if(e.type==='dart'){e.y+=e.vy;e.x+=Math.sin(e.phase)*1.5;}
      else if(e.type==='swoop'){e.x+=Math.cos(e.phase)*3*e.side;e.y+=e.vy*.7;if(e.x<10||e.x>W-10)e.side*=-1;}
      else{e.x+=e.vx;e.y+=e.vy*.5;if(e.x<10||e.x>W-10)e.vx*=-1;}
      e.shootTimer--;
      if(e.shootTimer<=0){
        s.eLasers.push({x:e.x,y:e.y+e.h,w:3,h:10,vy:4+s.level*.3});
        e.shootTimer=80+Math.floor(Math.random()*100);
        SFX.enemyShoot();
      }
      if(e.y+e.h>PY&&e.y<PY+PH&&e.x+e.w/2>s.paddle.x&&e.x-e.w/2<s.paddle.x+PW){
        spawnFX(e.x,e.y,'#ff2d55',18);e.alive=false;
        if(s.stunTimer<=0) SFX.stun();
        s.stunTimer=300;
        continue;
      }
      if(e.y>H+30)e.alive=false;
    }
  }

  // Enemy lasers (including diagonal boss bullets)
  for(let i=s.eLasers.length-1;i>=0;i--){
    const el=s.eLasers[i];
    if(el.isBoss){el.x+=(el.vx||0);}
    el.y+=el.vy;
    if(el.y+el.h>PY&&el.y<PY+PH&&el.x+el.w>s.paddle.x&&el.x<s.paddle.x+PW){
      s.eLasers.splice(i,1);
      if(el.isBoss){
        if(el.isStun){
          spawnFX(el.x,PY,'#c084fc',10);
          SFX.stunHit();
          s.stunTimer=Math.max(s.stunTimer,150);
          continue;
        }
        spawnFX(el.x,PY,'#ff2d55',14);
        SFX.lostBall();
        s.lives--;
        s.deadCause='boss';
        s.phase=s.lives<=0?'gameover':'dead';
        if(s.lives<=0) SFX.gameover();
        s.balls=[];s.drops=[];s.coins=[];s.floaters=[];s.lasers=[];s.eLasers=[];s.enemies=[];s.fx={};s.paddle.w=80;s.laserOn=false;s.stunTimer=0;
        return;
      }
      SFX.eLaserHit();
      spawnFX(el.x,PY,'#ff9f0a',8);
      if(!s.fx.WIDE||s.fx.WIDE<now){s.fx.TINY=now+3000;s.paddle.w=Math.max(s.paddle.w-12,44);}
      continue;
    }
    if(el.y>H+10||el.x<-20||el.x>W+20)s.eLasers.splice(i,1);
  }

  // Balls
  const dead=[];
  s.balls.forEach((b,idx)=>{
    // Sanitize: kill any ball with invalid position or velocity
    if(!isFinite(b.x)||!isFinite(b.y)||!isFinite(b.vx)||!isFinite(b.vy)){
      dead.push(idx); return;
    }
    if(b.caught){b.x=s.paddle.x+PW/2+b.catchOff;b.y=PY-BR-1;return;}
    clampSpd(b,s.level,isSlow);
    let{x,y,vx,vy}=b;

    // Sub-step: move in chunks of at most BR pixels to prevent tunneling
    const dist=Math.hypot(vx,vy);
    const substeps=Math.ceil(dist/BR);
    const dx=vx/substeps, dy=vy/substeps;

    for(let si=0;si<substeps;si++){
      x+=dx; y+=dy;

      // Walls
      if(x-BR<0){x=BR;vx=Math.abs(vx);SFX.wall();}
      if(x+BR>W){
        if(s.wallBreak){s.wallBreak=false;s.phase='win';return;}
        x=W-BR;vx=-Math.abs(vx);SFX.wall();
      }
      if(y-BR<0){y=BR;vy=Math.abs(vy);SFX.wall();}

      // Paddle
      if(vy>0&&x+BR>s.paddle.x&&x-BR<s.paddle.x+PW&&y+BR>PY&&y-BR<PY+PH){
        y=PY-BR;
        const rel=(x-s.paddle.x)/PW;
        const angle=-Math.PI/2+(rel-.5)*Math.PI*.7;
        const spd=ballSpeed(s.level)*(isSlow?SLOW_MULT:1);
        vx=Math.cos(angle)*spd; vy=Math.sin(angle)*spd;
        if(vy>-1)vy=-1;
        SFX.paddle();
        if(isCatch){b.caught=true;b.catchOff=x-(s.paddle.x+PW/2);b.x=x;b.y=y;b.vx=vx;b.vy=vy;s.balls[idx]=b;return;}
      }

      // Bricks
      let brickHit=false;
      for(const bk of s.bricks){
        if(!bk.alive)continue;
        if(x+BR>bk.x&&x-BR<bk.x+bk.w&&y+BR>bk.y&&y-BR<bk.y+bk.h){
          if(bk.type==='portal'){
            if(!b.portalCooldown){const pt=s.bricks.find(pb=>pb.alive&&pb.type==='portal'&&pb.portalColor===bk.portalColor&&pb!==bk);if(pt){x=pt.x+pt.w/2;y=pt.y+pt.h/2;b.portalCooldown=46;SFX.portal();spawnFX(pt.x+pt.w/2,pt.y+pt.h/2,bk.color[0],14);}}
            brickHit=true;break;
          }
          brickHit=true;
          bk.hits++;
          const ok=bk.hits>=bk.maxHits;
          if(bk.type!=='gold'){
            if(ok){bk.alive=false;s.score+=bk.pts;
              s.hyper=Math.min(s.hyper+(bk.type==='silver'?12:6),s.hyperMax);
              SFX[bk.type==='silver'?'brickSilver':'brickNormal']();
              spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
              if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y+bk.h/2,w:28,h:18,vy:2.2,type:bk.pu});
              if(Math.random()<(bk.type==='silver'?0.7:0.38)) spawnCoin(bk.x+bk.w/2,bk.y+bk.h/2,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
            } else{spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,'#ccc',4);s.score+=10;addHyper(s,3);SFX.brickSilver();}
          } else { SFX.brickGold(); }
          const ol=x+BR-bk.x, or2=bk.x+bk.w-(x-BR);
          const ot=y+BR-bk.y, ob=bk.y+bk.h-(y-BR);
          if(Math.min(ol,or2)<Math.min(ot,ob)){
            if(ol<or2){x=bk.x-BR;} else{x=bk.x+bk.w+BR;}
            vx=-vx;
          } else {
            if(ot<ob){y=bk.y-BR;} else{y=bk.y+bk.h+BR;}
            vy=-vy;
          }
          break;
        }
      }
      if(brickHit) break; // stop sub-stepping after a bounce

      // Enemies
      for(const e of s.enemies){
        if(!e.alive)continue;
        const ex=e.x-e.w/2, ey=e.type==='crawler'?e.y-e.h:e.y;
        if(x+BR>ex&&x-BR<ex+e.w&&y+BR>ey&&y-BR<ey+e.h){
          e.hp--;
          if(e.hp<=0){e.alive=false;s.score+=e.type==='crawler'?350:200;addHyper(s,25);SFX.enemyDie();
            spawnFX(e.x,e.y,e.color,14);
            if(Math.random()<.4)s.drops.push({x:e.x-14,y:e.y,w:28,h:18,vy:2,type:PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)]});
            if(Math.random()<0.6) spawnCoin(e.x,e.y,50,'gold');
          } else spawnFX(e.x,e.y,'#aaa',5);
          vy=-Math.abs(vy); break;
        }
      }

    } // end substeps

    if(b.portalCooldown>0)b.portalCooldown--;
    if(y+BR>H+8)dead.push(idx);
    else{b.x=x;b.y=y;b.vx=vx;b.vy=vy;s.balls[idx]=b;}
  });

  for(let i=dead.length-1;i>=0;i--)s.balls.splice(dead[i],1);

  // ── Boss ball collision (post-move, one hit per ball per frame) ──
  if(s.boss&&s.boss.alive&&!s.boss.entering&&s.boss.hitCooldown===0){
    const boss=s.boss;
    const faceX=boss.x, faceY=boss.y-boss.h/2+20, faceR=36;
    for(const ball of s.balls){
      if(ball.caught) continue;
      const dx=ball.x-faceX, dy=ball.y-faceY;
      const dist=Math.hypot(dx,dy);
      if(dist<faceR+BR){
        boss.hp--; boss.hitFlash=8; boss.hitCooldown=30; boss.recoilY=-12;
        addHyper(s,8); s.score+=100; SFX.bossHit();
        spawnFX(ball.x,ball.y,'#ff2d55',10);
        if(Math.random()<0.3) spawnCoin(boss.x+(Math.random()-0.5)*50,boss.y+30,30,'gold');
        const nx=dist>0.5?dx/dist:0;
        const ny=dist>0.5?dy/dist:-1;
        const spd=ballSpeed(s.level)*(isSlow?SLOW_MULT:1);
        ball.vx=nx*spd; ball.vy=ny*spd;
        if(ball.vy>-1) ball.vy=-Math.abs(ball.vx||spd);
        const sp2=Math.hypot(ball.vx,ball.vy);
        if(sp2>0.01){ball.vx=ball.vx/sp2*spd; ball.vy=ball.vy/sp2*spd;}
        else{ball.vx=0; ball.vy=-spd;}
        ball.x=faceX+nx*(faceR+BR+4);
        ball.y=faceY+ny*(faceR+BR+4);
        if(ball.y>PY-BR-4) ball.y=PY-BR-4;
        // Final NaN guard
        if(!isFinite(ball.vx)||!isFinite(ball.vy)||!isFinite(ball.x)||!isFinite(ball.y)){
          ball.x=W/2; ball.y=PY-BR-20;
          const spd2=ballSpeed(s.level); ball.vx=0; ball.vy=-spd2;
        }
        if(boss.hp<=Math.floor(boss.maxHp*0.5)&&!boss.burstMode){
          boss.burstMode=true; SFX.bossRoar(); spawnFX(boss.x,boss.y,'#ff9f0a',30);
        }
        if(boss.hp<=Math.floor(boss.maxHp*0.25)&&!boss.enrageMode&&!boss.transforming){
          boss.transforming=true; boss.transformProgress=0;
          SFX.bossRoar(); spawnFX(boss.x,boss.y,'#ff9f0a',20);
        }
        if(boss.hp<=0&&boss.alive&&!boss.dying){
          boss.alive=false; boss.dying=true; boss.dyingTimer=210; boss.dyingExpTimer=8;
          SFX.bossDie();
        }
        break;
      }
    }
  }
  if(s.balls.length===0&&!(s.boss&&s.boss.dying)){
    SFX.lostBall();
    s.lives--;
    s.phase=s.lives<=0?'gameover':'dead';
    if(s.lives<=0) SFX.gameover();
    s.drops=[];s.lasers=[];s.eLasers=[];s.enemies=[];s.fx={};s.paddle.w=80;s.laserOn=false;s.stunTimer=0;
    return;
  }

  // Drops
  for(let i=s.drops.length-1;i>=0;i--){
    const d=s.drops[i];d.y+=d.vy;
    if(d.y+d.h>PY&&d.y<PY+PH&&d.x+d.w>s.paddle.x&&d.x<s.paddle.x+PW){applyPU(d.type);SFX.puCatch();s.drops.splice(i,1);}
    else if(d.y>H+10)s.drops.splice(i,1);
  }

  // Coins
  let _walletDelta=0;
  for(let i=s.coins.length-1;i>=0;i--){
    const c=s.coins[i];
    c.y+=c.vy; c.spin+=0.14;
    if(c.y+8>PY&&c.y<PY+PH&&c.x+8>s.paddle.x&&c.x-8<s.paddle.x+PW){
      s.score+=c.value;
      s.coinCount++;
      _walletDelta++;
      const col=c.tier==='gold'?'#ffd60a':c.tier==='silver'?'#ddd':'#cd7f32';
      s.floaters.push({x:c.x,y:PY-12,vy:-1.1,life:1,text:`+${c.value}`,color:col});
      SFX.coin();
      s.coins.splice(i,1);
    } else if(c.y>H+16) s.coins.splice(i,1);
  }
  if(_walletDelta) _saveWallet(_wallet+_walletDelta);

  // Score floaters
  for(let i=s.floaters.length-1;i>=0;i--){
    const f=s.floaters[i]; f.y+=f.vy; f.life-=0.022;
    if(f.life<=0) s.floaters.splice(i,1);
  }

  // ── Skin effects ──────────────────────────────────────────────
  const _skId=_equipped;
  s.balls.forEach(b=>{

  });
  // Skin-specific trail length: shadow/galaxy linger longer
  const _trDecay=_skId==='shadow'?0.065:_skId==='galaxy'?0.08:_skId==='ice'?0.09:0.12;
  for(let i=s.ballTrail.length-1;i>=0;i--){
    s.ballTrail[i].life-=_trDecay;

  if(_skId==='shadow'){
    s.shadowTrail.push({x:s.paddle.x,w:PW});
    if(s.shadowTrail.length>9) s.shadowTrail.shift();
  } else {
    if(s.shadowTrail.length) s.shadowTrail=[];
  }
  if(s.skinParts.length<60){
    const px=s.paddle.x;
    if(_skId==='fire'){

          vx:(Math.random()-0.5)*1.8,vy:-1.4-Math.random()*2.2,

          size:1.5+Math.random()*3,
          col:Math.random()<0.45?'#ff3300':Math.random()<0.65?'#ff8800':'#ffcc00',type:'ember'});
      }
      if(Math.random()<0.18){
        s.skinParts.push({x:px+PW*0.5+(Math.random()-0.5)*PW*0.5,y:PY,
          vx:(Math.random()-0.5)*0.5,vy:-1.0-Math.random()*0.8,
          life:0.7,decay:0.022,size:7+Math.random()*6,col:'#2a0a00',type:'puff'});
      }
    }
    if(_skId==='ice'){
      if(Math.random()<0.28){
        s.skinParts.push({x:px+8+Math.random()*(PW-16),y:PY,
          vx:(Math.random()-0.5)*0.7,vy:-0.5-Math.random()*0.7,
          life:1,decay:0.013,size:2+Math.random()*2.5,
          col:Math.random()<0.3?'#ffffff':Math.random()<0.55?'#aaeeff':'#00ccff',type:'snow'});
      }
      if(Math.random()<0.12){
        s.skinParts.push({x:px+Math.random()*PW,y:PY+PH*0.4,
          vx:(Math.random()-0.5)*0.25,vy:-0.15-Math.random()*0.2,
          life:0.5,decay:0.008,size:12+Math.random()*8,col:'#aaeeff',type:'mist'});
      }
    }
    if(_skId==='toxic'){
      if(Math.random()<0.28){
        s.skinParts.push({x:px+10+Math.random()*(PW-20),y:PY,
          vx:(Math.random()-0.5)*0.4,vy:-0.6-Math.random()*0.7,
          life:1,decay:0.015,size:3+Math.random()*3.5,
          col:Math.random()<0.4?'#22ff44':Math.random()<0.65?'#aaff22':'#00ff88',
          type:'bubble',wobble:Math.random()*Math.PI*2});
      }
      if(Math.random()<0.1){
        s.skinParts.push({x:px+Math.random()*PW,y:PY+PH,
          vx:(Math.random()-0.5)*0.15,vy:0.5+Math.random()*0.5,
          life:0.7,decay:0.018,size:2+Math.random()*2,col:'#22ff44',type:'drip'});
      }
    }
    if(_skId==='gold'&&Math.random()<0.38){
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*1.4,vy:-0.8-Math.random()*1.2,
        life:1,decay:0.026,size:1+Math.random()*2.5,
        col:Math.random()<0.35?'#ffd60a':Math.random()<0.6?'#ffe566':'#ffffff',type:'spark'});
    }
    if(_skId==='galaxy'){
      if(Math.random()<0.38){
        const gc=['#7b2ff7','#e040fb','#00ddff','#ffd60a','#ff5af2'];
        s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
          vx:(Math.random()-0.5)*1.2,vy:-0.7-Math.random()*1.1,
          life:1,decay:0.019,size:1.5+Math.random()*2.5,
          col:gc[Math.floor(Math.random()*gc.length)],type:'star',rot:Math.random()*Math.PI*2});
      }
      if(Math.random()<0.1){
        const gc=['#7b2ff7','#e040fb','#00ddff'];
        s.skinParts.push({x:px+Math.random()*PW,y:PY,
          vx:(Math.random()-0.5)*6,vy:-8-Math.random()*5,
          life:0.55,decay:0.055,size:1.5,
          col:gc[Math.floor(Math.random()*gc.length)],type:'spark'});
      }
    }
    if(_skId==='shadow'&&Math.random()<0.28){
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*0.7,vy:-0.3-Math.random()*0.7,
        life:1,decay:0.022,size:4+Math.random()*5,
        col:Math.random()<0.5?'#9977cc':'#6644aa',
        type:'wisp',wobble:Math.random()*Math.PI*2});
    }
    if(_skId==='boss'){
      if(Math.random()<0.44){
        const side=Math.random()<0.5;
        s.skinParts.push({x:px+(side?Math.random()*18:PW-Math.random()*18),y:PY+PH*0.25,
          vx:(Math.random()-0.5)*2.0,vy:-1.5-Math.random()*2.2,
          life:1,decay:0.034+Math.random()*0.02,
          size:2+Math.random()*4,
          col:Math.random()<0.45?'#ff1100':Math.random()<0.65?'#ff5500':'#ff9900',type:'ember'});
      }
      if(Math.random()<0.14){
        s.skinParts.push({x:px+Math.random()*PW,y:PY,
          vx:(Math.random()-0.5)*0.4,vy:-0.4-Math.random()*0.3,
          life:0.6,decay:0.012,size:9+Math.random()*7,col:'#3a0000',type:'puff'});
      }
    }
    if(_skId==='classic'&&Math.random()<0.18){
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*1.0,vy:-0.5-Math.random()*0.8,
        life:1,decay:0.026,size:1.5+Math.random()*2,
        col:Math.random()<0.5?'#4da6ff':'#00ddff',type:'spark'});
    }
  }
  for(let i=s.skinParts.length-1;i>=0;i--){
    const p=s.skinParts[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.type==='ember'||p.type==='puff'){p.vy*=0.97;p.vx*=0.97;}
    if(p.type==='bubble'||p.type==='wisp') p.x+=Math.sin(p.wobble=(p.wobble||0)+0.12)*0.4;
    if(p.type==='star') p.rot+=0.08;
    if(p.type==='drip') p.vy*=1.04;
    if(p.type==='mist') p.size*=1.025;
    if(p.life<=0) s.skinParts.splice(i,1);
  }

  // Player lasers
  for(let i=s.lasers.length-1;i>=0;i--){
    const l=s.lasers[i];l.y+=l.vy;let hit=false;
    for(const bk of s.bricks){
      if(!bk.alive)continue;
      if(bk.type==='portal')continue;
      if(l.x+l.w>bk.x&&l.x<bk.x+bk.w&&l.y<bk.y+bk.h&&l.y+l.h>bk.y){
        if(bk.type!=='gold'){bk.hits++;
          if(bk.hits>=bk.maxHits){bk.alive=false;s.score+=bk.pts;
            addHyper(s,6);
            spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
            if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y,w:28,h:18,vy:2.2,type:bk.pu});
            if(Math.random()<(bk.type==='silver'?0.7:0.38)) spawnCoin(bk.x+bk.w/2,bk.y,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
          }else spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,'#ccc',4);
        }
        hit=true;break;
      }
    }
    if(!hit){
      for(const e of s.enemies){
        if(!e.alive)continue;
        const ex=e.x-e.w/2, ey=e.type==='crawler'?e.y-e.h:e.y;
        if(l.x+l.w>ex&&l.x<ex+e.w&&l.y<ey+e.h&&l.y+l.h>ey){
          e.hp--;
          if(e.hp<=0){e.alive=false;s.score+=e.type==='crawler'?350:200;addHyper(s,25);SFX.enemyDie();
            spawnFX(e.x,e.y,e.color,14);
            if(Math.random()<.4)s.drops.push({x:e.x-14,y:e.y,w:28,h:18,vy:2,type:PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)]});
            if(Math.random()<0.6) spawnCoin(e.x,e.y,50,'gold');
          }
          hit=true;break;
        }
      }
    }
    if(hit||l.y+l.h<0)s.lasers.splice(i,1);
  }

  // Hyper beam
  if(s.hyperBeam){
    const beam=s.hyperBeam;
    beam.timer--;
    // Every 3 frames, destroy everything in the beam column
    if(beam.timer%3===0){
      const bw=32; // beam half-width
      for(const bk of s.bricks){
        if(!bk.alive||bk.type==='gold'||bk.type==='portal')continue;
        if(bk.x+bk.w>beam.x-bw&&bk.x<beam.x+bw){
          bk.hits=bk.maxHits; bk.alive=false; s.score+=bk.pts;
          addHyper(s,2);
          spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#ff0',10);
          if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y,w:28,h:18,vy:2.2,type:bk.pu});
          if(Math.random()<0.25) spawnCoin(bk.x+bk.w/2,bk.y+bk.h/2,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
        }
      }
      for(const e of s.enemies){
        if(!e.alive)continue;
        if(e.x+e.w/2>beam.x-bw&&e.x-e.w/2<beam.x+bw){
          e.alive=false; s.score+=e.type==='crawler'?350:200;
          spawnFX(e.x,e.y,e.color,16);
          if(Math.random()<0.5) spawnCoin(e.x,e.y,50,'gold');
        }
      }
      // Also destroy enemy lasers in beam path
      for(let i=s.eLasers.length-1;i>=0;i--){
        const el=s.eLasers[i];
        if(el.x+el.w>beam.x-bw&&el.x<beam.x+bw) s.eLasers.splice(i,1);
      }
    }
    if(beam.timer<=0) s.hyperBeam=null;
  }

  // ── Boss tick ────────────────────────────────────────────────
  if(s.boss&&(s.boss.alive||s.boss.dying)){
    const b=s.boss;
    b.phase+=0.04;

    // ─ Entry: slide in from top ─
    if(b.entering){
      b.entryProgress=Math.min(b.entryProgress+0.014,1);
      const ease=1-Math.pow(1-b.entryProgress,3);
      b.y=-140+230*ease;
      if(b.entryProgress>=1){
        b.entering=false; b.y=90; b.landingShock=30;
        spawnFX(b.x,b.y+20,'#ff2d55',28);
        SFX.bossRoar();
      }
      return;
    }

    // ─ Death animation ─
    if(b.dying){
      b.dyingTimer--;
      b.dyingExpTimer--;
      const prog=1-b.dyingTimer/210;
      if(b.dyingExpTimer<=0){
        spawnFX(
          b.x+(Math.random()-0.5)*120,b.y+(Math.random()-0.5)*80,
          ['#ff2d55','#ff9f0a','#ffd60a','#fff','#bf5af2'][Math.floor(Math.random()*5)],
          Math.floor(10+prog*25)
        );
        b.dyingExpTimer=Math.max(2,Math.floor(14-prog*12));
      }
      if(b.dyingTimer<=0) s.phase='bossdead';
      return;
    }

    if(b.hitFlash>0) b.hitFlash--;
    if(b.hitCooldown>0) b.hitCooldown--;
    // Recoil decay
    if(b.recoilY!==0){b.recoilY*=0.80;if(Math.abs(b.recoilY)<0.3)b.recoilY=0;}
    // Eye gaze tracks nearest ball
    if(s.balls.length>0){const tb=s.balls.reduce((a,c)=>Math.abs(c.x-b.x)<Math.abs(a.x-b.x)?c:a);b.eyeGazeX+=(tb.x-b.eyeGazeX)*0.06;}
    // Landing shockwave countdown
    if(b.landingShock>0) b.landingShock--;
    // ─ Transformation animation: hold still while cocoon opens ─
    if(b.transforming){
      b.transformProgress=Math.min(b.transformProgress+0.008,1);
      if(b.transformProgress>=1){
        b.transforming=false; b.enrageMode=true;
        SFX.bossRoar(); spawnFX(b.x,b.y,'#ff2d55',40); b.vx*=1.5;
      }
      return;
    }

    // Movement: side-to-side, faster when enraged
    b.x += b.vx * (b.enrageMode?1+Math.sin(b.phase)*0.5:1);
    if(b.x-b.w/2<8){b.x=8+b.w/2;b.vx=Math.abs(b.vx);}
    if(b.x+b.w/2>W-8){b.x=W-8-b.w/2;b.vx=-Math.abs(b.vx);}

    // Subtle vertical drift when enraged
    if(b.enrageMode){
      b.y+=Math.sin(b.phase*1.3)*0.5;
      b.y=Math.max(50,Math.min(130,b.y));
    }

    // Blink
    b.blinkTimer--;
    if(b.blinkTimer<=0){
      b.eyeL.open=b.eyeL.open>0?0:1;
      b.eyeR.open=b.eyeR.open>0?0:1;
      b.blinkTimer=b.eyeL.open?100+Math.random()*80:8;
    }

    // Shooting patterns
    b.shootTimer--;
    if(b.shootTimer<=0){
      const cx=b.x, cy=b.y+b.h/2;
      if(b.enrageMode){
        // Spread: 3 bullets in a fan
        [-0.4,0,0.4].forEach(a=>{
          const spd2=4.5+s.level*0.1;
          s.eLasers.push({x:cx,y:cy,w:5,h:14,vx:Math.sin(a)*spd2,vy:Math.cos(a)*spd2,isBoss:true});
        });
        SFX.enemyShoot();
        b.shootTimer=120;
      } else if(b.burstMode){
        // Double burst aimed at paddle
        [-0.25,0.25].forEach((off,i)=>{
          setTimeout(()=>{
            if(!s.boss||!s.boss.alive)return;
            const tx=s.paddle.x+s.paddle.w/2, ty=PY;
            const dx=tx-b.x, dy=ty-b.y;
            const dist=Math.hypot(dx,dy);
            const spd3=4.8;
            s.eLasers.push({x:b.x,y:b.y+b.h/2,w:5,h:14,
              vx:(dx/dist+off)*spd3,vy:(dy/dist)*spd3,isBoss:true});
            SFX.enemyShoot();
          },i*120);
        });
        b.shootTimer=190;
      } else {
        // Aimed single shot
        const tx=s.paddle.x+s.paddle.w/2, ty=PY;
        const dx=tx-b.x, dy=ty-b.y, dist=Math.hypot(dx,dy);
        const spd4=4.5;
        s.eLasers.push({x:b.x,y:b.y+b.h/2,w:5,h:14,
          vx:dx/dist*spd4, vy:dy/dist*spd4, isBoss:true});
        SFX.enemyShoot();
        b.shootTimer=240;
      }
    }

    // Stun shot — periodic, 3-shot spread aimed at paddle, stuns instead of dealing damage
    b.stunShotTimer--;
    if(b.stunShotTimer<=0){
      const tx=s.paddle.x+s.paddle.w/2, ty=PY;
      const dx=tx-b.x, dy=ty-b.y, dist=Math.hypot(dx,dy);
      const spd=3.2;
      [-0.22,0,0.22].forEach(off=>{
        s.eLasers.push({x:b.x,y:b.y+b.h/2,w:12,h:12,
          vx:(dx/dist+off)*spd,vy:dy/dist*spd,isBoss:true,isStun:true});
      });
      SFX.stunShot();
      b.stunShotTimer=380;
    }

    // Hyper beam hits boss
    if(s.hyperBeam&&b.hitCooldown===0){
      const beam=s.hyperBeam;
      if(b.x+b.w/2>beam.x-32&&b.x-b.w/2<beam.x+32){
        if(beam.timer%6===0){
          b.hp=Math.max(0,b.hp-1); b.hitFlash=8; b.hitCooldown=6; b.recoilY=-6;
          addHyper(s,3); s.score+=50; SFX.bossHit();
          spawnFX(b.x+(Math.random()-0.5)*b.w,b.y,'#ff0',6);
          if(b.hp<=0&&b.alive&&!b.dying){
            b.alive=false; b.dying=true; b.dyingTimer=210; b.dyingExpTimer=8;
            SFX.bossDie();
          }
          if(b.hp<=Math.floor(b.maxHp*0.5)&&!b.burstMode){b.burstMode=true;SFX.bossRoar();}
          if(b.hp<=Math.floor(b.maxHp*0.25)&&!b.enrageMode&&!b.transforming){b.transforming=true;b.transformProgress=0;SFX.bossRoar();spawnFX(b.x,b.y,'#ff9f0a',20);}
        }
      }
    }

    // Player lasers hit boss face
    for(let i=s.lasers.length-1;i>=0;i--){
      const l=s.lasers[i];
      if(b.hitCooldown>0) break;
      const faceX=b.x,faceY=b.y-b.h/2+20,faceR=36;
      if(Math.hypot(l.x-faceX,l.y-faceY)<faceR+8){
        b.hp=Math.max(0,b.hp-1); b.hitFlash=8; b.recoilY=-9;
        addHyper(s,5); s.score+=50; SFX.bossHit();
        spawnFX(l.x,l.y,'#bf5af2',6);
        s.lasers.splice(i,1);
        if(b.hp<=0&&b.alive&&!b.dying){
          b.alive=false; b.dying=true; b.dyingTimer=210; b.dyingExpTimer=8;
          SFX.bossDie();
        }
        if(b.hp<=Math.floor(b.maxHp*0.5)&&!b.burstMode){b.burstMode=true;SFX.bossRoar();}
        if(b.hp<=Math.floor(b.maxHp*0.25)&&!b.enrageMode&&!b.transforming){b.transforming=true;b.transformProgress=0;SFX.bossRoar();spawnFX(b.x,b.y,'#ff9f0a',20);}
      }
    }
  }



  for(let i=s.particles.length-1;i>=0;i--){
    const p=s.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.decay;
    if(p.life<=0)s.particles.splice(i,1);
  }

  if(s.phase==='playing'){
    if(s.level%13===0){
      // Boss level: only win via bossdead (set by setTimeout after boss dies)
    } else if(s.bricks.length>0&&s.bricks.every(b=>!b.alive||b.type==='gold'||b.type==='portal')){
      s.lifeBonus=s.lives*500;
      s.score+=s.lifeBonus;
      s.phase= s.level%13===12 ? 'win_boss' : 'win';
      SFX.levelUp();
    }
  }
}
function draw(){
  const sc=SC(),s=st,now=performance.now(),PW=s.paddle.w;
  ctx.save();ctx.scale(sc,sc);

  // Background
  ctx.fillStyle='#07071a';ctx.fillRect(0,0,W,H);

  // Nebula clouds (slow drift)
  const nt=now*0.00007;
  const nb=[
    [W*0.22+Math.sin(nt)*28,    H*0.28+Math.cos(nt*0.7)*18,  110, 'rgba(40,0,80,0.32)'],
    [W*0.78+Math.cos(nt*0.9)*22,H*0.55+Math.sin(nt*1.1)*16,  90,  'rgba(0,20,60,0.28)'],
    [W*0.5 +Math.sin(nt*0.6)*18,H*0.72+Math.cos(nt*0.8)*14,  70,  'rgba(20,0,50,0.22)'],
  ];
  nb.forEach(([nx,ny,nr,nc])=>{
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);
    ng.addColorStop(0,nc); ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  });

  // Starfield
  STARS.forEach(st2=>{
    st2.flicker+=st2.fspd;
    ctx.globalAlpha=st2.base*(0.65+Math.sin(st2.flicker)*0.35);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(st2.x,st2.y,st2.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Subtle grid
  ctx.strokeStyle='rgba(255,255,255,.014)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Wall-break indicator
  if(s.wallBreak){
    ctx.fillStyle='rgba(48,209,88,.1)';ctx.fillRect(W-6,0,6,H);
    ctx.strokeStyle='#30d158';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(W-2,0);ctx.lineTo(W-2,H);ctx.stroke();ctx.setLineDash([]);
  }

  // Particles
  ctx.save();
  s.particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  ctx.restore();

  // Bricks
  s.bricks.forEach(b=>{
    if(!b.alive)return;
    const prog=b.maxHits>1?(b.maxHits-b.hits)/b.maxHits:1;

      ctx.arcTo(sX,sY+sH,sX,sY+sH-6,6); ctx.lineTo(sX,sY+6);
      ctx.arcTo(sX,sY,sX+6,sY,6); ctx.closePath(); ctx.fill();
      // Stem texture lines
      ctx.strokeStyle='rgba(120,90,50,0.28)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(bx-10,sY+6); ctx.lineTo(bx-10,sY+sH-6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx+10,sY+6); ctx.lineTo(bx+10,sY+sH-6); ctx.stroke();

      // ── Gills under cap brim ──
      ctx.strokeStyle='rgba(60,10,3,0.3)'; ctx.lineWidth=1.2;
      for(let gi=-5;gi<=5;gi++){
        const gx=bx+gi*9, gy=sY-1;
        ctx.beginPath(); ctx.moveTo(gx-3,gy); ctx.lineTo(gx,gy-6); ctx.lineTo(gx+3,gy); ctx.stroke();
      }

      // ── Cap ──
      const capCY=by-14+breath;
      ctx.shadowColor=flash?'#fff':capColor; ctx.shadowBlur=flash?30:22;
      const capG=ctx.createRadialGradient(bx-18,by-40+breath,2,bx,capCY,66);
      capG.addColorStop(0,flash?'#fff':capHi);
      capG.addColorStop(0.4,flash?'#ffcccc':b.burstMode?'#dd6600':'#cc1a00');
      capG.addColorStop(0.78,flash?'#ff9999':b.burstMode?'#882200':'#780900');
      capG.addColorStop(1,flash?'#ff6666':'#2e0400');
      ctx.fillStyle=capG;
      // Mushroom cap bezier path — dome + brim overhang
      ctx.beginPath();
      ctx.moveTo(bx-60,by+2+breath);
      ctx.bezierCurveTo(bx-64,by-4+breath,bx-57,by-17+breath,bx-50,by-27+breath);
      ctx.bezierCurveTo(bx-36,by-63+breath,bx+36,by-63+breath,bx+50,by-27+breath);
      ctx.bezierCurveTo(bx+57,by-17+breath,bx+64,by-4+breath,bx+60,by+2+breath);
      ctx.bezierCurveTo(bx+46,by+14+breath,bx-46,by+14+breath,bx-60,by+2+breath);
      ctx.closePath(); ctx.fill();
      // Rim stroke
      ctx.strokeStyle=flash?'rgba(255,255,255,0.55)':'rgba(255,140,70,0.32)'; ctx.lineWidth=1.5;
      ctx.stroke(); ctx.shadowBlur=0;
      // Specular highlight — primary
      ctx.fillStyle=`rgba(255,255,255,${flash?0.18:0.22})`;
      ctx.beginPath(); ctx.ellipse(bx-18,by-40+breath,20,12,-0.5,0,Math.PI*2); ctx.fill();
      // Specular — soft secondary
      ctx.fillStyle=`rgba(255,255,255,${flash?0.06:0.09})`;
      ctx.beginPath(); ctx.ellipse(bx-6,by-28+breath,34,20,-0.4,0,Math.PI*2); ctx.fill();

      // ── Spots — hexagons ──
      const drawHex=(cx,cy,r,rot)=>{ctx.beginPath();for(let i=0;i<6;i++){const a=rot+(i/6)*Math.PI*2-Math.PI/2;i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();};
      [[bx,by-45+breath,10.5,0],[bx-25,by-27+breath,7.5,Math.PI/6],[bx+25,by-27+breath,7.5,-Math.PI/6],
       [bx-45,by-10+breath,5.5,Math.PI/4],[bx+45,by-10+breath,5.5,-Math.PI/4]].forEach(([sx,sy,sr,rot],idx)=>{
        let pulse=0;
        if(b.burstMode){
          pulse=Math.sin(b.phase*4+idx*1.1)*0.5+0.5;
          const g=Math.floor(200+pulse*55);
          ctx.shadowColor=`rgba(255,${g},0,1)`; ctx.shadowBlur=6+pulse*28;
        }
        drawHex(sx,sy,sr,rot);
        const hg2=ctx.createRadialGradient(sx-sr*0.3,sy-sr*0.35,0,sx,sy,sr);
        hg2.addColorStop(0,flash?'rgba(255,210,210,0.6)':b.burstMode?`rgba(255,${Math.floor(220+pulse*35)},${Math.floor(pulse*60)},0.98)`:'rgba(255,255,255,0.97)');
        hg2.addColorStop(0.6,flash?'rgba(255,160,160,0.3)':b.burstMode?'rgba(255,210,70,0.85)':'rgba(248,248,232,0.85)');
        hg2.addColorStop(1,flash?'rgba(220,80,80,0.08)':b.burstMode?'rgba(210,130,0,0.3)':'rgba(195,160,140,0.3)');
        ctx.fillStyle=hg2; ctx.fill();
        ctx.strokeStyle=b.burstMode?`rgba(255,${Math.floor(180+pulse*75)},0,${0.4+pulse*0.55})`:'rgba(190,160,130,0.35)';
        ctx.lineWidth=1; ctx.stroke();
        ctx.shadowBlur=0;
      });

      // ── Eyebrows ──
      const eyeY=by+2+breath;
      const browY=eyeY-13;
      ctx.lineCap='round'; ctx.lineWidth=4.5;
      if(b.burstMode){
        ctx.strokeStyle='#881400'; ctx.shadowColor='#ff2200'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(bx-26,browY-5); ctx.lineTo(bx-8,browY+7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx+8,browY+7); ctx.lineTo(bx+26,browY-5); ctx.stroke();
      } else {
        ctx.strokeStyle='#2a1000'; ctx.shadowBlur=0;
        ctx.beginPath(); ctx.moveTo(bx-25,browY+2); ctx.quadraticCurveTo(bx-15,browY-6,bx-7,browY+1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx+7,browY+1); ctx.quadraticCurveTo(bx+15,browY-6,bx+25,browY+2); ctx.stroke();
      }
      ctx.shadowBlur=0; ctx.lineCap='butt';

      // ── Eyes — oval Makibao style, with ball-tracking gaze ──
      [[bx-14,b.eyeL],[bx+14,b.eyeR]].forEach(([ex,eye])=>{
        // Gaze offset: pupil tracks nearest ball horizontally
        const gazeOff=Math.max(-4,Math.min(4,(b.eyeGazeX-ex)*0.09));
        ctx.fillStyle='#060200';
        ctx.beginPath(); ctx.ellipse(ex,eyeY,15,eye.open*9+1,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#f8f3ea';
        ctx.beginPath(); ctx.ellipse(ex,eyeY,13,eye.open*7.5+1,0,0,Math.PI*2); ctx.fill();
        if(eye.open>0.2){
          const ic=b.burstMode?'#cc4400':'#8b008b';
          ctx.fillStyle=ic; ctx.shadowColor=ic; ctx.shadowBlur=9;
          ctx.beginPath(); ctx.ellipse(ex+gazeOff,eyeY,8.5,eye.open*6,0,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          ctx.fillStyle='#030100'; ctx.beginPath(); ctx.ellipse(ex+gazeOff,eyeY,5,eye.open*4,0,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.ellipse(ex+gazeOff-4,eyeY-2.5,4,2,0,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.beginPath(); ctx.ellipse(ex+gazeOff+3,eyeY+2,1.8,1,0,0,Math.PI*2); ctx.fill();
        }
      });

      // Blush (normal mode)
      if(!b.burstMode&&!flash){
        ctx.fillStyle='rgba(255,100,75,0.2)';
        ctx.beginPath(); ctx.ellipse(bx-25,eyeY+5,9,5,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx+25,eyeY+5,9,5,0,0,Math.PI*2); ctx.fill();
      }

      // ── Mouth / horse teeth ──
      const mouthY=eyeY+19;
      if(b.burstMode){
        const bmy=mouthY+8;
        // Angry upside-down mouth
        ctx.fillStyle='#140400';
        ctx.beginPath(); ctx.arc(bx,bmy,13,0.12,Math.PI-0.12,true); ctx.fill();
        ctx.strokeStyle='#330000'; ctx.lineWidth=2; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(bx,bmy,13,0.12,Math.PI-0.12,true); ctx.stroke();
        ctx.lineCap='butt';
        // Mustache with C and K
        ctx.fillStyle='#1a0800';
        ctx.beginPath();
        ctx.moveTo(bx-2,mouthY-5);
        ctx.bezierCurveTo(bx-7,mouthY-13,bx-22,mouthY-12,bx-24,mouthY-3);
        ctx.bezierCurveTo(bx-22,mouthY+4,bx-11,mouthY+1,bx-2,mouthY-5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bx+2,mouthY-5);
        ctx.bezierCurveTo(bx+7,mouthY-13,bx+22,mouthY-12,bx+24,mouthY-3);
        ctx.bezierCurveTo(bx+22,mouthY+4,bx+11,mouthY+1,bx+2,mouthY-5);
        ctx.fill();
        // Red stains on mustache
        ctx.fillStyle='rgba(180,20,10,0.72)';
        ctx.beginPath(); ctx.ellipse(bx-18,mouthY-4,4,2.5,-0.3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx-10,mouthY-8,2.5,1.8,0.4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx-15,mouthY-1,3,1.5,0.1,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx+18,mouthY-4,4,2.5,0.3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx+10,mouthY-8,2.5,1.8,-0.4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(bx+15,mouthY-1,3,1.5,-0.1,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#f0e8d0'; ctx.font='bold 8px Courier New';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('C',bx-13,mouthY-5);
        ctx.fillText('K',bx+13,mouthY-5);
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      } else {
        // Relaxed — dark interior, teeth strip, red tongue
        ctx.fillStyle='#140400';
        ctx.beginPath(); ctx.arc(bx,mouthY,13,0.12,Math.PI-0.12); ctx.fill();
        ctx.fillStyle='#f0ece0';
        ctx.beginPath(); ctx.arc(bx,mouthY,11,0.18,Math.PI-0.18); ctx.fill();
        ctx.fillStyle='#cc2e18';
        ctx.beginPath(); ctx.ellipse(bx,mouthY+5,7,4,0,0,Math.PI); ctx.fill();
        ctx.strokeStyle='#1a0200'; ctx.lineWidth=2; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(bx,mouthY,13,0.12,Math.PI-0.12); ctx.stroke();
        ctx.lineCap='butt';
      }
    }

    // HP bar (skip during death or entry)
    if(!b.dying&&!b.entering){
      const barW=b.w+20,barX=bx-barW/2,barY=by-b.h/2-16;
      ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(barX,barY,barW,10);
      const hpPct=b.hp/b.maxHp;
      const hpCol=hpPct>0.5?'#30d158':hpPct>0.25?'#ff9f0a':'#ff2d55';
      const hpGrad=ctx.createLinearGradient(barX,0,barX+barW,0);

      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1; ctx.strokeRect(barX,barY,barW,10);
      ctx.fillStyle='#fff'; ctx.font='bold 8px Courier New'; ctx.textAlign='center';
      ctx.fillText(`${b.hp}/${b.maxHp}`,bx,barY-2);
      if(b.enrageMode){
        ctx.fillStyle=`rgba(255,45,85,${0.6+Math.sin(b.phase*8)*0.4})`;
        ctx.font='bold 11px Courier New'; ctx.fillText('⚠ ENRAGE',bx,by+b.h/2+14);
      } else if(b.burstMode){
        ctx.fillStyle=`rgba(255,159,10,${0.6+Math.sin(b.phase*6)*0.4})`;
        ctx.font='bold 11px Courier New'; ctx.fillText('⚡ BURST',bx,by+b.h/2+14);
      } else if(b.transforming){
        ctx.fillStyle=`rgba(255,200,50,${0.7+Math.sin(b.phase*10)*0.3})`;
        ctx.font='bold 11px Courier New'; ctx.fillText('⚡ TRANSFORMING...',bx,by+b.h/2+14);
      }
    }
    ctx.restore();

    // ── Landing shockwave ring ──
    if(b.landingShock>0){
      const lsp=1-b.landingShock/30;
      const lsr=lsp*140, lsa=1-lsp;
      ctx.strokeStyle=`rgba(255,45,85,${lsa*0.85})`; ctx.lineWidth=3+lsa*2;
      ctx.shadowColor='#ff2d55'; ctx.shadowBlur=24*lsa;
      ctx.beginPath(); ctx.ellipse(bx,by+b.h/2-10,lsr,lsr*0.3,0,0,Math.PI*2);
      ctx.stroke(); ctx.shadowBlur=0;

    // ── Burst/enrage screen vignette ──
    if((b.burstMode||b.enrageMode)&&!b.dying&&!b.entering){
      const vg=ctx.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,H*0.88);
      vg.addColorStop(0,'rgba(0,0,0,0)');
      vg.addColorStop(1,b.enrageMode?'rgba(180,0,0,0.18)':'rgba(180,60,0,0.12)');
      ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
    }

    // ── Death shockwave ring (first 0.3 of death animation) ──
    if(b.dying){
      const dp=1-b.dyingTimer/210;
      if(dp<0.35){
        const dsr=dp/0.35*180, dsa=1-dp/0.35;
        ctx.strokeStyle=`rgba(255,220,60,${dsa*0.8})`; ctx.lineWidth=5;
        ctx.shadowColor='#ffd60a'; ctx.shadowBlur=30*dsa;
        ctx.beginPath(); ctx.ellipse(bx,by,dsr,dsr*0.55,0,0,Math.PI*2);
        ctx.stroke(); ctx.shadowBlur=0;
      }
    }

    // Screen flash: transform climax
    if(b.transforming&&b.transformProgress>0.90){
      const fa=(b.transformProgress-0.90)/0.10;
      ctx.fillStyle=`rgba(255,45,85,${fa*0.55})`;
      ctx.fillRect(0,0,W,H);
    }
    // Screen flash: death climax
    if(b.dying){
      const prog=1-b.dyingTimer/210;
      if(prog>0.80){
        const fa=(prog-0.80)/0.20;
        ctx.fillStyle=`rgba(255,220,60,${fa*0.9})`;
        ctx.fillRect(0,0,W,H);
      }
    }
  }

  // Boss bullets — oriented bullet shapes / stun orbs
  s.eLasers.filter(el=>el.isBoss).forEach(el=>{
    const cx=el.x+el.w/2, cy=el.y+el.h/2;
    if(el.isStun){
      ctx.save();
      const pulse=0.85+0.15*Math.sin(Date.now()*0.012);
      ctx.shadowColor='#a855f7'; ctx.shadowBlur=22*pulse;
      const sg=ctx.createRadialGradient(cx-2,cy-2,1,cx,cy,9*pulse);
      sg.addColorStop(0,'#ffffff');sg.addColorStop(0.3,'#e9d5ff');
      sg.addColorStop(0.7,'#a855f7');sg.addColorStop(1,'rgba(109,40,217,0)');
      ctx.fillStyle=sg;
      ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fill();
      // Rotating lightning arcs
      ctx.strokeStyle='rgba(216,180,254,0.75)';ctx.lineWidth=1.2;
      const t=Date.now()*0.006;
      for(let a=0;a<3;a++){
        const ang=t+a*Math.PI*2/3;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*5,cy+Math.sin(ang)*5);
        ctx.lineTo(cx+Math.cos(ang+0.6)*10,cy+Math.sin(ang+0.6)*10);
        ctx.stroke();
      }
      ctx.shadowBlur=0;
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(el.vy, el.vx||0));
    ctx.shadowColor='#ff5500'; ctx.shadowBlur=14;
    // Brass casing (rear)
    const cg=ctx.createLinearGradient(0,-4,0,4);
    cg.addColorStop(0,'#c8920a');cg.addColorStop(0.45,'#f5d060');cg.addColorStop(1,'#8a5e06');
    ctx.fillStyle=cg; ctx.fillRect(-10,-4,7,8);
    // Lead body (middle)
    const bg=ctx.createLinearGradient(0,-3.5,0,3.5);
    bg.addColorStop(0,'#aaaaaa');bg.addColorStop(0.3,'#eeeeee');bg.addColorStop(1,'#666666');
    ctx.fillStyle=bg; ctx.fillRect(-3,-3.5,9,7);
    // Pointed nose cone
    ctx.fillStyle='#dddddd';
    ctx.beginPath();ctx.moveTo(6,-3.5);ctx.lineTo(11,0);ctx.lineTo(6,3.5);ctx.closePath();ctx.fill();
    // Casing/body seam line
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(-3,4);ctx.stroke();
    // Specular gleam
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.ellipse(1,-1.8,3,0.9,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  });

  // Regular enemy lasers
  s.eLasers.filter(el=>!el.isBoss).forEach(el=>{ctx.fillStyle='#ff9f0a';ctx.shadowColor='#ff9f0a';ctx.shadowBlur=8;
    ctx.beginPath();ctx.roundRect(el.x,el.y,el.w,el.h,2);ctx.fill();ctx.shadowBlur=0;});


  // Player lasers
  s.lasers.forEach(l=>{
    // Outer glow
    ctx.shadowColor='#bf5af2';ctx.shadowBlur=18;
    const lg=ctx.createLinearGradient(l.x,l.y,l.x,l.y+l.h);
    lg.addColorStop(0,'#ffffff');lg.addColorStop(0.3,'#e090ff');lg.addColorStop(1,'#7a00cc');
    ctx.fillStyle=lg;
    ctx.beginPath();ctx.roundRect(l.x,l.y,l.w,l.h,2);ctx.fill();ctx.shadowBlur=0;
  });

  // Drops
  ctx.textAlign='center';
  s.drops.forEach(d=>{
    const def=PU[d.type];if(!def)return;
    const pulse=0.7+Math.sin(now*0.007+d.x*0.05)*0.3;
    // Glow
    ctx.shadowColor=def.color;ctx.shadowBlur=14*pulse;
    // Body gradient
    const dg=ctx.createLinearGradient(d.x,d.y,d.x,d.y+d.h);
    dg.addColorStop(0,'rgba(255,255,255,0.08)');dg.addColorStop(1,def.bg);
    ctx.fillStyle=dg;
    ctx.beginPath();ctx.roundRect(d.x,d.y,d.w,d.h,7);ctx.fill();
    // Border
    ctx.strokeStyle=def.color;ctx.lineWidth=1.5;ctx.globalAlpha=pulse;
    ctx.beginPath();ctx.roundRect(d.x,d.y,d.w,d.h,7);ctx.stroke();
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    // Inner top sheen
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath();ctx.roundRect(d.x+3,d.y+2,d.w-6,5,3);ctx.fill();
    // Emoji
    ctx.font='12px Courier New';ctx.fillStyle=def.color;
    ctx.fillText(def.emoji,d.x+d.w/2,d.y+14);
  });

  // Coins
  s.coins.forEach(c=>{
    const col=c.tier==='gold'?'#ffd60a':c.tier==='silver'?'#cccccc':'#cd7f32';
    const colHi=c.tier==='gold'?'#fffaaa':c.tier==='silver'?'#ffffff':'#f0a060';
    const colDk=c.tier==='gold'?'#886600':c.tier==='silver'?'#777777':'#7a3f00';
    ctx.save();
    ctx.translate(c.x,c.y);
    const scaleX=Math.abs(Math.cos(c.spin));
    ctx.shadowColor=col; ctx.shadowBlur=10;
    const cg=ctx.createRadialGradient(-2,-2,1,0,0,8);
    cg.addColorStop(0,colHi); cg.addColorStop(0.5,col); cg.addColorStop(1,colDk);
    ctx.fillStyle=cg;
    ctx.scale(scaleX<0.08?0.08:scaleX,1);
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    if(scaleX>0.35){
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.font='bold 9px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('$',0,0.5);
    }
    ctx.restore();
  });

  // Score floaters
  s.floaters.forEach(f=>{
    ctx.save();
    ctx.globalAlpha=f.life;
    ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=7;
    ctx.font='bold 11px Courier New'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0; ctx.restore();
  });

  // ── Skin: shadow trail (drawn behind paddle) ──────────────────
  if(_equipped==='shadow'&&s.shadowTrail.length>1){
    s.shadowTrail.forEach((tr,idx)=>{
      const pct=(idx+1)/s.shadowTrail.length;
      ctx.globalAlpha=pct*0.38;
      const tg=ctx.createLinearGradient(tr.x,PY,tr.x+tr.w,PY);
      tg.addColorStop(0,'#331155'); tg.addColorStop(0.5,'#9977cc'); tg.addColorStop(1,'#331155');
      ctx.fillStyle=tg; ctx.shadowColor='#8855bb'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.roundRect(tr.x,PY,tr.w,PH,6); ctx.fill();
      ctx.shadowBlur=0;
    });
    ctx.globalAlpha=1;
  }

  // Paddle
  const isLa=s.fx.LASER&&s.fx.LASER>now,isWi=s.fx.WIDE&&s.fx.WIDE>now;
  const isTi=s.fx.TINY&&s.fx.TINY>now,isCa=s.fx.CATCH&&s.fx.CATCH>now;
  const isStun=s.stunTimer>0;
  const _sc=SKINS[_equipped]||SKINS.classic;
  const pc=isStun?['#888','#ccc','#888']:isLa?['#bf5af2','#d48aff','#bf5af2']:isCa?['#ff9f0a','#ffd060','#ff9f0a']:
    isWi?['#30d158','#6ee89a','#30d158']:isTi?['#ff2d55','#ff6b82','#ff2d55']:_sc.col;
  const pg=ctx.createLinearGradient(s.paddle.x,PY,s.paddle.x+PW,PY);
  pg.addColorStop(0,pc[0]);pg.addColorStop(.5,pc[1]);pg.addColorStop(1,pc[2]);

  ctx.fillText('HYPER',gaugeX-54,gaugeY+7);
  ctx.textAlign='right';
  ctx.fillStyle=full?'#ffd60a':'#555';
  ctx.fillText(full?'X / 3×TAP':'',gaugeX+gaugeW+52,gaugeY+7);


  const active=Object.entries(s.fx).filter(([,v])=>v&&v>now);
  active.forEach(([k],i)=>{
    const d=PU[k];if(!d)return;
    const secs=Math.ceil((s.fx[k]-now)/1000);
    const bx=4+i*72,by=4;
    ctx.fillStyle=d.bg;ctx.strokeStyle=d.color;ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,by,68,16,4);ctx.fill();ctx.stroke();
    ctx.fillStyle=d.color;ctx.font='bold 9px Courier New';ctx.textAlign='left';
    ctx.fillText(`${d.emoji} ${d.label} ${secs}s`,bx+3,by+11);
  });

  // Bottom HUD bar
  ctx.fillStyle='rgba(5,5,20,0.82)';ctx.fillRect(0,H-38,W,38);
  // Top edge glow line
  const hudGl=ctx.createLinearGradient(0,0,W,0);
  hudGl.addColorStop(0,'rgba(77,166,255,0)');
  hudGl.addColorStop(0.5,'rgba(77,166,255,0.5)');
  hudGl.addColorStop(1,'rgba(77,166,255,0)');
  ctx.fillStyle=hudGl;ctx.fillRect(0,H-39,W,1);

  // LVL
  ctx.font='bold 9px Courier New';ctx.textAlign='left';
  ctx.fillStyle='#4da6ff';ctx.fillText('LVL',7,H-22);
  ctx.font='bold 15px Courier New';ctx.fillStyle='#ffffff';
  ctx.fillText(s.level,28,H-20);

  // SCORE (centre)
  ctx.textAlign='center';
  ctx.font='bold 9px Courier New';ctx.fillStyle='#666';ctx.fillText('SCORE',W/2,H-24);
  ctx.font='bold 14px Courier New';ctx.fillStyle='#ffd60a';
  ctx.shadowColor='#ffd60a';ctx.shadowBlur=8;
  ctx.fillText(s.score,W/2,H-10);ctx.shadowBlur=0;

  // Coin counter
  ctx.textAlign='left';
  const coinPulse=s.coinCount>0&&Math.floor(performance.now()/400)%2===0;
  ctx.fillStyle=coinPulse?'#ffe566':'#aaa';
  ctx.shadowColor='#ffd60a';ctx.shadowBlur=coinPulse?8:0;
  ctx.font='bold 11px Courier New';ctx.fillText(`🪙 ${_wallet}`,W*0.66,H-10);

  // Lives as glowing dots
  const maxLives=Math.max(s.lives,0);
