<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Generate Icons</title></head>
<body>
<p style="font-family:monospace;color:#888">Generating icons...</p>
<script>
function drawIcon(size){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const ctx=c.getContext('2d');
  const s=size/512;

  // Background
  ctx.fillStyle='#05050f';
  ctx.beginPath(); ctx.roundRect(0,0,size,size,90*s); ctx.fill();

  // Stem
  ctx.fillStyle='#eeddb5';
  ctx.beginPath(); ctx.roundRect(186*s,318*s,140*s,112*s,18*s); ctx.fill();

  // Cap gradient
  const capG=ctx.createRadialGradient(196*s,140*s,2*s,256*s,220*s,210*s);
  capG.addColorStop(0,'#ff5522'); capG.addColorStop(0.42,'#cc1a00');
  capG.addColorStop(0.78,'#780900'); capG.addColorStop(1,'#2e0400');
  ctx.fillStyle=capG;
  ctx.beginPath();
  ctx.moveTo(66*s,302*s);
  ctx.bezierCurveTo(46*s,270*s,50*s,200*s,90*s,148*s);
  ctx.bezierCurveTo(140*s,80*s,186*s,44*s,256*s,44*s);
  ctx.bezierCurveTo(326*s,44*s,372*s,80*s,422*s,148*s);
  ctx.bezierCurveTo(462*s,200*s,466*s,270*s,446*s,302*s);
  ctx.bezierCurveTo(410*s,346*s,302*s,364*s,256*s,364*s);
  ctx.bezierCurveTo(210*s,364*s,102*s,346*s,66*s,302*s);
  ctx.closePath(); ctx.fill();

  // Specular
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.save(); ctx.translate(196*s,140*s); ctx.rotate(-0.35);
  ctx.beginPath(); ctx.ellipse(0,0,68*s,42*s,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Hex spots helper
  function hex(cx,cy,r){
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;
      i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
    ctx.closePath();
  }
  [[256,100,34],[162,179,23],[350,179,23],[104,254,17],[408,254,17]].forEach(([hx,hy,hr])=>{
    hex(hx*s,hy*s,hr*s);
    ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fill();
    ctx.strokeStyle='rgba(190,150,120,0.35)'; ctx.lineWidth=2*s; ctx.stroke();
  });

  return c;
}

[192,512].forEach(size=>{
  const canvas=drawIcon(size);
  const a=document.createElement('a');
  a.download=`icon-${size}.png`;
  a.href=canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
});
document.querySelector('p').textContent='Done! icon-192.png and icon-512.png downloaded.';
</script>
</body>
</html>
