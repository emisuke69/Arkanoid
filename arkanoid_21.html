<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arkanoid</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05050f;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;touch-action:none;overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
          env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{border-radius:10px;border:1px solid rgba(77,166,255,.2);
  box-shadow:0 0 30px rgba(77,166,255,.06);display:block;flex-shrink:0}
#mobile-bar{
  position:fixed;bottom:0;left:0;right:0;
  display:none;flex-shrink:0;
  gap:10px;padding:8px 8px max(env(safe-area-inset-bottom,0px),8px);
  width:100%;
  background:rgba(5,5,15,0.92);
  border-top:1px solid rgba(77,166,255,.18);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  z-index:20;}
#mobile-bar button{
  flex:1;padding:14px 0;border:none;border-radius:10px;
  font:bold 14px 'Courier New',monospace;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;letter-spacing:.5px;
  transition:background .1s}
#btn-laser{background:rgba(191,90,242,.18);color:#bf5af2;border:1px solid rgba(191,90,242,.5)}
#btn-laser:active{background:rgba(191,90,242,.45)}
#btn-hyper{background:rgba(255,159,10,.18);color:#ff9f0a;border:1px solid rgba(255,159,10,.5)}
#btn-hyper:active{background:rgba(255,159,10,.45)}
#btn-fs,#btn-pause{position:fixed;top:max(8px,env(safe-area-inset-top,8px));
  background:rgba(0,0,0,.55);color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.15);border-radius:6px;
  padding:6px 9px;font-size:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;z-index:10;line-height:1}
#btn-fs{right:8px}
#btn-pause{right:50px}
#btn-pause.paused{color:#ffd60a;border-color:rgba(255,214,10,.5);background:rgba(20,15,0,.7)}
@media(hover:none)and(pointer:coarse){#mobile-bar{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mobile-bar">
  <button id="btn-laser">🔫 LASER</button>
  <button id="btn-hyper">🔥 HYPER</button>
</div>
<button id="btn-pause" title="Pause">⏸</button>
<button id="btn-fs" title="Fullscreen">⛶</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

// ── Constants ─────────────────────────────────────────────────
const W=480,H=520,PH=12,PY=478,BR=7;
const BASE_SPEED=7.5,SPD_INC=0.35,MAX_SPD=9.5,MAX_SPD_2=12.0,SLOW_MULT=0.55;
const STEP=1000/60;

// ── Responsive canvas ─────────────────────────────────────────
const MB_H=72; // reserved px for fixed mobile bar
function resize(){
  const mbH=document.getElementById('mobile-bar').style.display==='flex'?MB_H:0;
  const r=Math.min((innerWidth-8)/480,(innerHeight-8-mbH)/520);
  canvas.width=Math.floor(480*r); canvas.height=Math.floor(520*r);
  canvas.style.width=canvas.width+'px'; canvas.style.height=canvas.height+'px';
}
resize(); window.addEventListener('resize',()=>{resize();});
const SC=()=>canvas.width/480;

// ── Color palettes ────────────────────────────────────────────
const COLORS=[
  ['#ff2d55','#ff6b82'],['#ff9f0a','#ffbf4d'],['#ffd60a','#ffe566'],
  ['#30d158','#6ee89a'],['#0a84ff','#4da6ff'],['#bf5af2','#d48aff'],
];
const PU={
  WIDE: {emoji:'↔️', label:'BREIT',    color:'#4da6ff',bg:'#0a2040',dur:8000},
  SLOW: {emoji:'🐢', label:'LANGSAM',  color:'#30d158',bg:'#0a2014',dur:7000},
  MULTI:{emoji:'⚡', label:'MULTIBALL',color:'#ffd60a',bg:'#201800',dur:null},
  LIFE: {emoji:'❤️', label:'+LEBEN',   color:'#ff2d55',bg:'#200814',dur:null},
  LASER:{emoji:'🔫', label:'LASER',    color:'#bf5af2',bg:'#180a28',dur:7000},
  CATCH:{emoji:'🧲', label:'CATCH',    color:'#ff9f0a',bg:'#201000',dur:10000},
  BREAK:{emoji:'🚪', label:'BREAK',    color:'#30d158',bg:'#0a2014',dur:null},
  TINY: {emoji:'😬', label:'MINI!',    color:'#ff6b82',bg:'#200808',dur:6000},
};
const PU_KEYS=Object.keys(PU);

// ── Skin shop ─────────────────────────────────────────────────
const SKINS={
  classic: {name:'CLASSIC',  price:0,  col:['#4da6ff','#a0d4ff','#4da6ff'], glow:'#4da6ff'},
  fire:    {name:'FIRE',     price:8,  col:['#ff4400','#ffaa00','#ff4400'], glow:'#ff6600'},
  ice:     {name:'ICE',      price:12, col:['#00ddff','#aaeeff','#00ddff'], glow:'#00ccff'},
  toxic:   {name:'TOXIC',    price:18, col:['#22ff44','#aaff22','#22ff44'], glow:'#00ff44'},
  shadow:  {name:'SHADOW',   price:25, col:['#554477','#9977cc','#554477'], glow:'#8855bb'},
  gold:    {name:'GOLD',     price:35, col:['#b8860b','#ffe566','#b8860b'], glow:'#ffd60a'},
  galaxy:  {name:'GALAXY',   price:50, col:['#7b2ff7','#e040fb','#7b2ff7'], glow:'#bf5af2'},
  boss:    {name:'BOSS RED', price:70, col:['#cc1a00','#ff5522','#cc1a00'], glow:'#ff2d55'},
};
const SKIN_IDS=Object.keys(SKINS);
const SHOP_BTN={x:160,y:448,w:160,h:30}; // idle-screen button
// Cached persistent state (avoids repeated localStorage reads per frame)
let _wallet=parseInt(localStorage.getItem('ark_wallet')||'0');
let _owned=(()=>{try{const a=JSON.parse(localStorage.getItem('ark_skins'));return Array.isArray(a)?a:['classic'];}catch{return['classic'];}})();
let _equipped=localStorage.getItem('ark_equipped')||'classic';
if(!SKINS[_equipped])_equipped='classic';
function _saveWallet(n){_wallet=Math.max(0,n);localStorage.setItem('ark_wallet',_wallet);}
function _saveOwned(a){_owned=a;localStorage.setItem('ark_skins',JSON.stringify(a));}
function _saveEquipped(id){_equipped=id;localStorage.setItem('ark_equipped',id);}
function handleShopClick(x,y){
  // Back button
  if(x>=8&&x<=104&&y>=H-44&&y<=H-16){st.phase='idle';return;}
  const wallet=_wallet;
  SKIN_IDS.forEach((id,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const cx=6+col*240, cy=72+row*84;
    const btnX=cx+240-68, btnY=cy+84/2-16, btnW=60, btnH=32;
    if(x>=btnX&&x<=btnX+btnW&&y>=btnY&&y<=btnY+btnH){
      if(_owned.includes(id)){_saveEquipped(id);}
      else if(wallet>=SKINS[id].price){
        _saveWallet(wallet-SKINS[id].price);
        _saveOwned([..._owned,id]);
        _saveEquipped(id);
      }
    }
  });
}

// ── Level layout helpers ──────────────────────────────────────
const N=(c,p=null)=>({t:'n',c,p});
const S=(p=null)=>({t:'s',p});
const G=()=>({t:'g'});
const _=null;

const LAYOUTS=[
  // Lv1: gentle intro – 3 full rows
  [
    [N(0),N(0),N(0),N(0),N(0,'WIDE'),N(0),N(0),N(0,'LIFE'),N(0),N(0)],
    [N(1),N(1),N(1,'SLOW'),N(1),N(1),N(1),N(1),N(1),N(1),N(1)],
    [N(2),N(2),N(2),N(2),N(2),N(2),N(2,'MULTI'),N(2),N(2),N(2)],
    [_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv2: diamond with silver
  [
    [_,_,_,N(3),S('WIDE'),N(3),_,_,_,_],
    [_,_,N(2),S(),N(2,'CATCH'),S(),N(2),_,_,_],
    [_,N(1),S(),N(1),S('SLOW'),N(1),S(),N(1),_,_],
    [_,_,N(2),S(),N(2),S(),N(2),_,_,_],
    [_,_,_,N(3),S('LIFE'),N(3),_,_,_,_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv3 FIX: gold on LEFT+RIGHT columns only → top/bottom open, ball never trapped
  [
    [_,  N(0),N(1,'LASER'),N(2),S('MULTI'),S(),     N(3),N(4),N(5),   _],
    [G(),S(),  N(1),       N(2),N(3,'WIDE'),N(4),   N(5),S(), N(0),   G()],
    [G(),N(5), N(4),S('CATCH'),N(3),        N(2),   S(), N(1),N(0),   G()],
    [G(),N(0,'LIFE'),N(1), N(2),S(),        S(),    N(3),N(4),N(5,'SLOW'),G()],
    [_,  N(3), S(),  N(2), N(1),            N(0),   S('MULTI'),N(5),N(4),_],
    [_,_,_,_,_,_,_,_,_,_],
  ],
  // Lv4: fortress with gap top+bottom center
  [
    [G(),G(),G(),G(),_,_,G(),G(),G(),G()],
    [G(),_,_,_,_,_,_,_,_,G()],
    [G(),N(2),N(1,'LIFE'),S('CATCH'),N(3),N(3),S('LASER'),N(1),N(2),G()],
    [G(),N(4),N(5),S(),N(0),N(0),S(),N(5),N(4),G()],
    [G(),_,_,_,_,_,_,_,_,G()],
    [G(),G(),G(),G(),_,_,G(),G(),G(),G()],
  ],
  // Lv5: X shape with gold centre
  [
    [N(5,'WIDE'),_,_,_,S(),S(),_,_,_,N(5)],
    [_,N(4),N(4),_,S('CATCH'),S(),_,N(4),N(4),_],
    [_,_,N(3),N(3),G(),G(),N(3,'MULTI'),N(3),_,_],
    [_,_,N(2),N(2),G(),G(),N(2),N(2),_,_],
    [_,N(1),N(1),_,S('LASER'),S(),_,N(1),N(1),_],
    [N(0),_,_,_,S(),S(),_,_,_,N(0,'LIFE')],
  ],
  // Lv6: dense mix – gold pillars + silver rows
  [
    ...[0,1,2,3,4,5].map(r=>
      Array.from({length:10},(_,c)=>({
        t:((r+c)%4===0)?'g':((r+c)%4===1)?'s':'n',
        c:(r*3+c)%6,
        p:(r===0&&c===4)?'MULTI':(r===1&&c===2)?'WIDE':(r===2&&c===7)?'LASER'
          :(r===3&&c===1)?'CATCH':(r===4&&c===8)?'SLOW':null,
      }))
    ),
  ],
];

// ── Brick factory ─────────────────────────────────────────────
function makeBricks(lv){
  const layout=LAYOUTS[(lv-1)%LAYOUTS.length];
  const bw=W/10,bh=22,bp=3,top=52,silverHits=2+Math.floor(lv/3);
  const bricks=[];
  layout.forEach((row,r)=>{
    (row||[]).forEach((cell,c)=>{
      if(!cell)return;
      const x=c*bw+bp,y=top+r*(bh+bp),w=bw-bp*2,h=bh;
      let type,color,pts,maxHits;
      if(cell.t==='g'){type='gold';  color=['#b8860b','#ffe566'];pts=0; maxHits=9999;}
      else if(cell.t==='s'){type='silver';color=['#999','#ddd']; pts=50;maxHits=silverHits;}
      else{type='normal';color=COLORS[((cell.c||0)+6)%6];pts=(6-r)*10+10;maxHits=1;}
      bricks.push({x,y,w,h,type,color,pts,maxHits,hits:0,alive:true,pu:cell.p||null});
    });
  });
  return bricks;
}

// ── Enemy factory ─────────────────────────────────────────────
const ECOLS={dart:'#ff2d55',swoop:'#ff9f0a',zigzag:'#bf5af2',crawler:'#00e5ff'};
function spawnEnemy(lv){
  const types=['dart','swoop','zigzag'];
  const t=types[Math.floor(Math.random()*Math.min(3,1+Math.floor(lv/2)))]||'dart';
  const spd=1.5+lv*0.15;
  return{x:30+Math.random()*(W-60),y:-30,w:24,h:20,type:t,
    side:Math.random()<.5?-1:1,vx:(Math.random()-.5)*spd*2,vy:spd*.8,
    phase:0,hp:1,alive:true,shootTimer:60+Math.floor(Math.random()*120),
    color:ECOLS[t]||'#ff2d55'};
}
// Spawn a crawler anchored to the bottom of a random alive brick
function spawnCrawler(bricks,lv){
  const alive=bricks.filter(b=>b.alive&&b.type!=='gold');
  if(!alive.length)return null;
  const anchor=alive[Math.floor(Math.random()*alive.length)];
  return{
    type:'crawler',color:'#00e5ff',
    x:anchor.x+anchor.w/2, y:anchor.y+anchor.h, // sit on bottom of brick
    w:18,h:14,
    dir:Math.random()<.5?-1:1,  // crawl direction: -1=left, 1=right
    spd:1.2+lv*0.1,
    phase:0,hp:2,alive:true,
    shootTimer:90+Math.floor(Math.random()*90),
    eatTimer:180,  // frames until it eats current brick
    anchorBrick:anchor, // brick it's currently riding on
  };
}

// ── Audio engine (Web Audio API, procedural) ──────────────────
let AC=null;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function playTone({type='square',freq=440,freq2=null,vol=0.18,attack=0.005,decay=0.08,dur=0.12,detune=0,noise=0}={}){
  try{
    const ac=getAC(), t=ac.currentTime;
    const gain=ac.createGain();
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(vol,t+attack);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    gain.connect(ac.destination);
    const osc=ac.createOscillator();
    osc.type=type; osc.frequency.setValueAtTime(freq,t);
    osc.detune.setValueAtTime(detune,t);
    if(freq2) osc.frequency.exponentialRampToValueAtTime(freq2,t+dur);
    osc.connect(gain); osc.start(t); osc.stop(t+dur+0.02);
    if(noise>0){
      const buf=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*noise;
      const src=ac.createBufferSource(), ng=ac.createGain();
      ng.gain.setValueAtTime(vol*.6,t);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+decay*.8);
      src.buffer=buf; src.connect(ng); ng.connect(ac.destination); src.start(t);
    }
  }catch(e){}
}
const SFX={
  paddle:()=>playTone({type:'sine',freq:260,freq2:320,vol:0.22,attack:0.003,decay:0.07,dur:0.08}),
  brickNormal:()=>playTone({type:'square',freq:440,freq2:380,vol:0.14,attack:0.002,decay:0.06,dur:0.07}),
  brickSilver:()=>playTone({type:'sawtooth',freq:300,freq2:240,vol:0.18,attack:0.003,decay:0.1,dur:0.1,detune:10}),
  brickGold:()=>playTone({type:'square',freq:180,freq2:160,vol:0.22,attack:0.004,decay:0.14,dur:0.12,noise:0.3}),
  wall:()=>playTone({type:'sine',freq:200,freq2:180,vol:0.12,attack:0.002,decay:0.05,dur:0.06}),
  enemyDie:()=>playTone({type:'sawtooth',freq:320,freq2:80,vol:0.25,attack:0.004,decay:0.22,dur:0.25,noise:0.4}),
  enemyShoot:()=>playTone({type:'square',freq:520,freq2:480,vol:0.1,attack:0.002,decay:0.06,dur:0.07}),
  eLaserHit:()=>playTone({type:'sawtooth',freq:180,freq2:90,vol:0.2,attack:0.003,decay:0.12,dur:0.12,noise:0.2}),
  laserShoot:()=>playTone({type:'sawtooth',freq:800,freq2:1200,vol:0.13,attack:0.002,decay:0.08,dur:0.09}),
  lostBall:()=>playTone({type:'sawtooth',freq:300,freq2:60,vol:0.35,attack:0.01,decay:0.5,dur:0.6,noise:0.2}),
  puCatch:()=>playTone({type:'sine',freq:600,freq2:900,vol:0.2,attack:0.005,decay:0.2,dur:0.22}),
  hyperCharge:()=>playTone({type:'sine',freq:880,freq2:1200,vol:0.25,attack:0.01,decay:0.25,dur:0.28}),
  hyperBeam:()=>{
    try{
      const ac=getAC(),t=ac.currentTime;
      // Low rumble
      const g1=ac.createGain(); g1.gain.setValueAtTime(0.3,t); g1.gain.linearRampToValueAtTime(0,t+0.75);
      const o1=ac.createOscillator(); o1.type='sawtooth'; o1.frequency.setValueAtTime(60,t);
      o1.frequency.linearRampToValueAtTime(40,t+0.75); o1.connect(g1); g1.connect(ac.destination);
      o1.start(t); o1.stop(t+0.8);
      // High whine
      const g2=ac.createGain(); g2.gain.setValueAtTime(0.2,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(1200,t);
      o2.frequency.linearRampToValueAtTime(400,t+0.7); o2.connect(g2); g2.connect(ac.destination);
      o2.start(t); o2.stop(t+0.75);
      // Noise burst
      const buf=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.4;
      const src=ac.createBufferSource(),ng=ac.createGain();
      ng.gain.setValueAtTime(0.3,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      src.buffer=buf; src.connect(ng); ng.connect(ac.destination); src.start(t);
    }catch(e){}
  },
  stun:()=>playTone({type:'sawtooth',freq:180,freq2:60,vol:0.3,attack:0.005,decay:0.4,dur:0.45,noise:0.3}),
  bossHit:()=>playTone({type:'square',freq:1400,freq2:700,vol:0.22,attack:0.001,decay:0.1,dur:0.12}),
  stunShot:()=>playTone({type:'sawtooth',freq:300,freq2:80,vol:0.18,attack:0.01,decay:0.35,dur:0.42}),
  stunHit:()=>playTone({type:'square',freq:880,freq2:110,vol:0.28,attack:0.001,decay:0.22,dur:0.28}),
  coin:()=>playTone({type:'sine',freq:1046,freq2:1568,vol:0.16,attack:0.002,decay:0.12,dur:0.14}),
  bossRoar:()=>{
    try{
      const ac=getAC(),t=ac.currentTime;
      const g=ac.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
      const o=ac.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(80,t);o.frequency.linearRampToValueAtTime(40,t+1.2);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.3);
      const buf=ac.createBuffer(1,ac.sampleRate*1.0,ac.sampleRate);
      const d2=buf.getChannelData(0);for(let i=0;i<d2.length;i++)d2[i]=(Math.random()*2-1)*0.5;
      const src=ac.createBufferSource(),ng=ac.createGain();
      ng.gain.setValueAtTime(0.35,t);ng.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
      src.buffer=buf;src.connect(ng);ng.connect(ac.destination);src.start(t);
    }catch(e){}
  },
  bossDie:()=>{
    try{
      const ac=getAC(),t=ac.currentTime;
      [0,0.15,0.3,0.5,0.7,0.95].forEach((dt,i)=>{
        const g=ac.createGain();g.gain.setValueAtTime(0.4-i*0.04,t+dt);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.4);
        const o=ac.createOscillator();o.type='sawtooth';
        o.frequency.setValueAtTime(200-i*20,t+dt);o.frequency.exponentialRampToValueAtTime(30,t+dt+0.4);
        o.connect(g);g.connect(ac.destination);o.start(t+dt);o.stop(t+dt+0.45);
        const buf=ac.createBuffer(1,ac.sampleRate*0.4,ac.sampleRate);
        const d2=buf.getChannelData(0);for(let j=0;j<d2.length;j++)d2[j]=(Math.random()*2-1)*0.5;
        const src=ac.createBufferSource(),ng=ac.createGain();
        ng.gain.setValueAtTime(0.3,t+dt);ng.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.4);
        src.buffer=buf;src.connect(ng);ng.connect(ac.destination);src.start(t+dt);
      });
    }catch(e){}
  },
  win:()=>{
    [0,4,7,12].forEach((s,i)=>{
      setTimeout(()=>playTone({type:'sine',freq:440*Math.pow(2,s/12),vol:0.22,attack:0.01,decay:0.3,dur:0.35}),i*120);
    });
  },
  gameover:()=>{
    [0,-2,-4,-7].forEach((s,i)=>{
      setTimeout(()=>playTone({type:'sawtooth',freq:220*Math.pow(2,s/12),vol:0.25,attack:0.01,decay:0.35,dur:0.4}),i*150);
    });
  },
  levelUp:()=>{
    [0,4,7,12,16].forEach((s,i)=>{
      setTimeout(()=>playTone({type:'sine',freq:523*Math.pow(2,s/12),vol:0.2,attack:0.008,decay:0.25,dur:0.3}),i*100);
    });
  },
};
// Resume AudioContext on first interaction (browser policy)
document.addEventListener('pointerdown',()=>getAC(),{once:true});
document.addEventListener('keydown',()=>getAC(),{once:true});


function spawnCoin(x,y,value,tier){
  st.coins.push({x,y,vy:1.6+Math.random()*0.9,value,spin:Math.random()*Math.PI*2,tier});
}
function addHyper(s,amt){
  const was=s.hyper;
  s.hyper=Math.min(s.hyper+amt,s.hyperMax);
  if(was<s.hyperMax&&s.hyper>=s.hyperMax) SFX.hyperCharge();
}
function ballSpeed(lv){
  if(lv>13) return Math.min(MAX_SPD+(lv-13)*SPD_INC,MAX_SPD_2);
  return Math.min(BASE_SPEED+(lv-1)*SPD_INC,MAX_SPD);
}
function clampSpd(b,lv,slow){
  const t=ballSpeed(lv)*(slow?SLOW_MULT:1),sp=Math.hypot(b.vx,b.vy);
  if(!isFinite(sp)||sp<0.01){b.vx=0;b.vy=-t;return;}
  b.vx=b.vx/sp*t; b.vy=b.vy/sp*t;
}
function makeBall(lv,x,y){
  const spd=ballSpeed(lv),a=-Math.PI/2+(Math.random()-.5)*.7;
  return{x:x??240,y:y??(PY-BR-2),vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,caught:false,catchOff:0};
}

// ── Boss: DOH ─────────────────────────────────────────────────
const BOSS_MAX_HP = 30;
function spawnBoss(){
  return {
    x: W/2, y: -140,         // starts off-screen (entry animation)
    w: 110, h: 80,
    hp: BOSS_MAX_HP,
    maxHp: BOSS_MAX_HP,
    vx: 1.4, vy: 0,
    phase: 0,
    shootTimer: 220,
    stunShotTimer: 350,
    burstMode: false,
    enrageMode: false,
    alive: true,
    eyeL: {open:1},
    eyeR: {open:1},
    blinkTimer: 120,
    hitFlash: 0,
    hitCooldown: 0,
    entering: true,          // entry slide-in animation
    entryProgress: 0,        // 0→1
    transforming: false,     // enrage cocoon→hexagon transition
    transformProgress: 0,    // 0→1
    dying: false,            // death animation active
    dyingTimer: 0,           // counts down from 210
    dyingExpTimer: 8,        // frames until next explosion during death
  };
}


function initState(lv=1){
  return{paddle:{x:200,w:80},balls:[makeBall(lv)],bricks:makeBricks(lv),
    drops:[],coins:[],floaters:[],coinCount:0,deadCause:null,lasers:[],eLasers:[],particles:[],enemies:[],
    skinParts:[],ballTrail:[],shadowTrail:[],
    enemyTimer:Math.max(180-lv*15,60),crawlerTimer:Math.max(300-lv*20,120),
    score:0,lives:3,level:lv,
    phase:'idle',targetX:240,fx:{},laserOn:false,wallBreak:false,wallBreakTimer:0,
    hyper:0,hyperMax:100,hyperBeam:null,boss:null,stunTimer:0};
}
let st=initState();

// ── Power-up application ──────────────────────────────────────
function spawnFX(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*4;
    st.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,decay:.03+Math.random()*.04,r:2+Math.random()*3,color});
  }
}
function applyPU(type){
  const s=st,now=performance.now(),d=PU[type];
  if(!d)return;
  if(type==='WIDE'){s.fx.WIDE=now+d.dur;s.fx.TINY=0;s.paddle.w=130;}
  else if(type==='TINY'){s.fx.TINY=now+d.dur;s.fx.WIDE=0;s.paddle.w=44;}
  else if(type==='SLOW'){s.fx.SLOW=now+d.dur;s.balls.forEach(b=>clampSpd(b,s.level,true));}
  else if(type==='LASER'){s.fx.LASER=now+d.dur;s.laserOn=true;}
  else if(type==='CATCH'){s.fx.CATCH=now+d.dur;}
  else if(type==='LIFE'){s.lives=Math.min(s.lives+1,5);}
  else if(type==='BREAK'){if(s.level%13!==0){s.wallBreak=true;s.wallBreakTimer=now+4000;}}
  else if(type==='MULTI'){
    const extras=[];
    s.balls.forEach(b=>{
      const sp=ballSpeed(s.level);
      [.8,-.8].forEach(off=>{const a=Math.atan2(b.vy,b.vx)+off;
        extras.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,caught:false,catchOff:0});});
    });
    s.balls=[...s.balls,...extras].slice(0,6);
  }
  spawnFX(s.paddle.x+s.paddle.w/2,PY,d.color,14);
}

// ── Launch / restart ──────────────────────────────────────────
function launch(){
  const s=st;
  if(s.phase==='idle'||s.phase==='dead'){
    s.deadCause=null;
    let rel=false;
    s.balls.forEach(b=>{if(b.caught){b.caught=false;rel=true;}});
    if(!rel) s.balls=[makeBall(s.level,s.paddle.x+s.paddle.w/2,PY-BR-2)];
    s.phase='playing';
  } else if(s.phase==='win'||s.phase==='win_boss'){
    const lv=s.level+1,px=s.paddle.x,sc=s.score;
    st=initState(lv); st.paddle.x=px; st.score=sc;
    // Boss level: skip bricks, spawn boss
    if(lv%13===0){
      st.bricks=[];
      st.boss=spawnBoss();
      SFX.bossRoar();
    }
  } else if(s.phase==='bossdead'){
    // After defeating boss, continue with next level
    const lv=s.level+1,px=s.paddle.x,sc=s.score+s.lives*1000;
    st=initState(lv); st.paddle.x=px; st.score=sc;
  } else if(s.phase==='gameover'){
    st=initState();
    paused=false;btnPause.textContent='⏸';btnPause.classList.remove('paused');
  } else if(s.phase==='playing'){
    s.balls.forEach(b=>{if(b.caught)b.caught=false;});
  }
}
function shootLaser(){
  if(!st.laserOn||st.phase!=='playing')return;
  const cx=st.paddle.x+st.paddle.w/2;
  st.lasers.push({x:cx-14,y:PY,w:4,h:14,vy:-16});
  st.lasers.push({x:cx+10,y:PY,w:4,h:14,vy:-16});
  SFX.laserShoot();
}

function fireHyper(){
  const s=st;
  if(s.phase!=='playing'||s.hyper<s.hyperMax||s.hyperBeam)return;
  const cx=s.paddle.x+s.paddle.w/2;
  s.hyperBeam={x:cx,timer:45}; // 45 frames of beam
  s.hyper=0; SFX.hyperBeam();
}
let paused=false;
const btnPause=document.getElementById('btn-pause');
function togglePause(){
  if(st.phase!=='playing')return;
  paused=!paused;
  btnPause.textContent=paused?'▶':'⏸';
  btnPause.classList.toggle('paused',paused);
}
btnPause.addEventListener('click',togglePause);

let lastTap=0,tapCount=0;
function canvasClick(cx,cy){
  if(paused){togglePause();return;}
  if(st.phase==='shop'){handleShopClick(cx,cy);return;}
  if(st.phase==='idle'){
    if(cx>=SHOP_BTN.x&&cx<=SHOP_BTN.x+SHOP_BTN.w&&cy>=SHOP_BTN.y&&cy<=SHOP_BTN.y+SHOP_BTN.h){
      st.phase='shop';return;
    }
  }
  launch();
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  canvasClick((e.clientX-r.left)/SC(),(e.clientY-r.top)/SC());
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const tx=(e.touches[0].clientX-r.left)/SC(),ty=(e.touches[0].clientY-r.top)/SC();
  st.targetX=tx;
  canvasClick(tx,ty);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  st.targetX=(e.touches[0].clientX-r.left)/SC();
},{passive:false});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  st.targetX=(e.clientX-r.left)/SC();
});
canvas.addEventListener('touchend',e=>{
  const now=performance.now();
  if(now-lastTap<300){
    tapCount++;
    if(tapCount===1) shootLaser();
    if(tapCount>=2){ fireHyper(); tapCount=0; }
  } else { tapCount=0; }
  lastTap=now;
},{passive:false});

// Show mobile buttons + wire them up if touch is available
if('ontouchstart' in window||navigator.maxTouchPoints>0){
  document.getElementById('mobile-bar').style.display='flex';
  document.body.style.paddingBottom=MB_H+'px';
  resize();
  ['touchstart','mousedown'].forEach(ev=>{
    document.getElementById('btn-laser').addEventListener(ev,e=>{e.preventDefault();shootLaser();},{passive:false});
    document.getElementById('btn-hyper').addEventListener(ev,e=>{e.preventDefault();fireHyper();},{passive:false});
  });
}

// Fullscreen toggle
function toggleFS(){
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  else document.exitFullscreen();
}
document.getElementById('btn-fs').addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('btn-fs').textContent=document.fullscreenElement?'✕':'⛶';
  resize();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(st.phase==='shop'){st.phase='idle';return;}
    if(paused){togglePause();return;}
  }
  if(e.key==='p'||e.key==='P'){togglePause();return;}
  if(e.key===' '){e.preventDefault();if(paused){togglePause();return;}launch();}
  if(e.key==='ArrowLeft') st.targetX=(st.paddle.x+st.paddle.w/2)-30;
  if(e.key==='ArrowRight')st.targetX=(st.paddle.x+st.paddle.w/2)+30;
  if(e.key==='z'||e.key==='Z') shootLaser();
  if(e.key==='x'||e.key==='X') fireHyper();
});

// ── Fixed-timestep tick ───────────────────────────────────────
function tick(){
  const s=st;
  if(paused)return;
  if(s.phase!=='playing'){s.coins=[];s.floaters=[];s.skinParts=[];s.ballTrail=[];s.shadowTrail=[];return;}
  const now=performance.now();

  // Expire effects
  for(const[k,v]of Object.entries(s.fx)){
    if(v&&now>v){
      if(k==='WIDE'||k==='TINY')s.paddle.w=80;
      if(k==='LASER')s.laserOn=false;
      if(k==='SLOW')s.balls.forEach(b=>clampSpd(b,s.level,false));
      s.fx[k]=0;
    }
  }
  if(s.wallBreak&&now>s.wallBreakTimer)s.wallBreak=false;

  const PW=s.paddle.w;
  const isSlow=!!(s.fx.SLOW&&s.fx.SLOW>now);
  const isCatch=!!(s.fx.CATCH&&s.fx.CATCH>now);
  const isStunned=s.stunTimer>0;
  if(isStunned) s.stunTimer--;

  // Paddle – dramatically slower when stunned
  const followSpeed = isStunned ? 0.025 : 0.18;
  s.paddle.x+=(s.targetX-(s.paddle.x+PW/2))*followSpeed;
  s.paddle.x=Math.max(0,Math.min(W-PW,s.paddle.x));

  // Enemy spawning (flyers)
  if(s.level>=2){
    s.enemyTimer--;
    if(s.enemyTimer<=0&&s.enemies.filter(e=>e.type!=='crawler').length<1+Math.floor(s.level/3)){
      s.enemies.push(spawnEnemy(s.level));
      s.enemyTimer=Math.max(300-s.level*15,140)+Math.floor(Math.random()*100);
    }
  }
  // Crawler spawning (lv3+)
  if(s.level>=3){
    s.crawlerTimer--;
    if(s.crawlerTimer<=0&&s.enemies.filter(e=>e.type==='crawler').length<1){
      const c=spawnCrawler(s.bricks,s.level);
      if(c) s.enemies.push(c);
      s.crawlerTimer=Math.max(600-s.level*20,300)+Math.floor(Math.random()*150);
    }
  }

  // Enemy movement & shooting
  for(let i=s.enemies.length-1;i>=0;i--){
    const e=s.enemies[i];
    if(!e.alive){s.enemies.splice(i,1);continue;}
    e.phase+=.04;

    if(e.type==='crawler'){
      // Find the brick we're anchored to
      const ab=e.anchorBrick;
      if(!ab||!ab.alive||ab.type==='gold'){
        // Try to land on brick below current position
        const bw=W/10,bh=22,bp=3,top=52;
        let found=null;
        for(const bk of s.bricks){
          if(!bk.alive||bk.type==='gold')continue;
          if(e.x>bk.x&&e.x<bk.x+bk.w&&Math.abs(e.y-(bk.y+bk.h))<4){found=bk;break;}
        }
        if(found){e.anchorBrick=found;e.y=found.y+found.h;}
        else{
          // Fall down and die if off screen
          e.y+=2; if(e.y>H+20){e.alive=false;} continue;
        }
      }

      // Walk along the bottom edge of the anchor brick
      e.x+=e.dir*e.spd;
      e.y=e.anchorBrick.y+e.anchorBrick.h; // stick to brick bottom

      // Check if we've walked off the edge of the current brick
      const ab2=e.anchorBrick;
      if(e.x-e.w/2>ab2.x+ab2.w||e.x+e.w/2<ab2.x){
        // Look for adjacent brick in same row to hop to
        let next=null;
        for(const bk of s.bricks){
          if(!bk.alive||bk===ab2||bk.type==='gold')continue;
          // Same row (y within 2px)
          if(Math.abs(bk.y-ab2.y)<2){
            if(e.dir>0&&bk.x>=ab2.x+ab2.w-2&&bk.x<ab2.x+ab2.w+bk.w){next=bk;break;}
            if(e.dir<0&&bk.x+bk.w<=ab2.x+2&&bk.x+bk.w>ab2.x-bk.w){next=bk;break;}
          }
        }
        if(next){e.anchorBrick=next;}
        else{e.dir*=-1;} // reverse at dead end
      }
      // Wall bounce
      if(e.x<e.w/2){e.x=e.w/2;e.dir=1;}
      if(e.x>W-e.w/2){e.x=W-e.w/2;e.dir=-1;}

      // Eat the brick over time
      e.eatTimer--;
      if(e.eatTimer<=0&&e.anchorBrick&&e.anchorBrick.alive&&e.anchorBrick.type!=='gold'){
        e.anchorBrick.hits++;
        e.eatTimer=150;
        spawnFX(e.x,e.y,'#00e5ff',5);
        if(e.anchorBrick.hits>=e.anchorBrick.maxHits){
          const bk=e.anchorBrick;
          bk.alive=false; s.score+=bk.pts;
          spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
          if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y+bk.h/2,w:28,h:18,vy:2.2,type:bk.pu});
          e.anchorBrick=null;
        }
      }

      // Shoot straight down toward paddle
      e.shootTimer--;
      if(e.shootTimer<=0){
        s.eLasers.push({x:e.x,y:e.y+e.h,w:3,h:12,vy:5+s.level*.2});
        e.shootTimer=90+Math.floor(Math.random()*90);
        SFX.enemyShoot();
      }

      // Hit paddle directly → stun player
      if(e.y+e.h>PY&&e.y<PY+PH&&e.x+e.w/2>s.paddle.x&&e.x-e.w/2<s.paddle.x+PW){
        spawnFX(e.x,e.y,'#00e5ff',18);e.alive=false;
        if(s.stunTimer<=0) SFX.stun();
        s.stunTimer=300; // 5 seconds at 60fps
      }

    } else {
      // Existing flyer movement
      if(e.type==='dart'){e.y+=e.vy;e.x+=Math.sin(e.phase)*1.5;}
      else if(e.type==='swoop'){e.x+=Math.cos(e.phase)*3*e.side;e.y+=e.vy*.7;if(e.x<10||e.x>W-10)e.side*=-1;}
      else{e.x+=e.vx;e.y+=e.vy*.5;if(e.x<10||e.x>W-10)e.vx*=-1;}
      e.shootTimer--;
      if(e.shootTimer<=0){
        s.eLasers.push({x:e.x,y:e.y+e.h,w:3,h:10,vy:4+s.level*.3});
        e.shootTimer=80+Math.floor(Math.random()*100);
        SFX.enemyShoot();
      }
      if(e.y+e.h>PY&&e.y<PY+PH&&e.x+e.w/2>s.paddle.x&&e.x-e.w/2<s.paddle.x+PW){
        spawnFX(e.x,e.y,'#ff2d55',18);e.alive=false;
        if(s.stunTimer<=0) SFX.stun();
        s.stunTimer=300;
        continue;
      }
      if(e.y>H+30)e.alive=false;
    }
  }

  // Enemy lasers (including diagonal boss bullets)
  for(let i=s.eLasers.length-1;i>=0;i--){
    const el=s.eLasers[i];
    if(el.isBoss){el.x+=(el.vx||0);}
    el.y+=el.vy;
    if(el.y+el.h>PY&&el.y<PY+PH&&el.x+el.w>s.paddle.x&&el.x<s.paddle.x+PW){
      s.eLasers.splice(i,1);
      if(el.isBoss){
        if(el.isStun){
          spawnFX(el.x,PY,'#c084fc',10);
          SFX.stunHit();
          s.stunTimer=Math.max(s.stunTimer,150);
          continue;
        }
        spawnFX(el.x,PY,'#ff2d55',14);
        SFX.lostBall();
        s.lives--;
        s.deadCause='boss';
        s.phase=s.lives<=0?'gameover':'dead';
        if(s.lives<=0) SFX.gameover();
        s.balls=[];s.drops=[];s.coins=[];s.floaters=[];s.lasers=[];s.eLasers=[];s.enemies=[];s.fx={};s.paddle.w=80;s.laserOn=false;s.stunTimer=0;
        return;
      }
      SFX.eLaserHit();
      spawnFX(el.x,PY,'#ff9f0a',8);
      if(!s.fx.WIDE||s.fx.WIDE<now){s.fx.TINY=now+3000;s.paddle.w=Math.max(s.paddle.w-12,44);}
      continue;
    }
    if(el.y>H+10||el.x<-20||el.x>W+20)s.eLasers.splice(i,1);
  }

  // Balls
  const dead=[];
  s.balls.forEach((b,idx)=>{
    // Sanitize: kill any ball with invalid position or velocity
    if(!isFinite(b.x)||!isFinite(b.y)||!isFinite(b.vx)||!isFinite(b.vy)){
      dead.push(idx); return;
    }
    if(b.caught){b.x=s.paddle.x+PW/2+b.catchOff;b.y=PY-BR-1;return;}
    clampSpd(b,s.level,isSlow);
    let{x,y,vx,vy}=b;

    // Sub-step: move in chunks of at most BR pixels to prevent tunneling
    const dist=Math.hypot(vx,vy);
    const substeps=Math.ceil(dist/BR);
    const dx=vx/substeps, dy=vy/substeps;

    for(let si=0;si<substeps;si++){
      x+=dx; y+=dy;

      // Walls
      if(x-BR<0){x=BR;vx=Math.abs(vx);SFX.wall();}
      if(x+BR>W){
        if(s.wallBreak){s.wallBreak=false;s.phase='win';return;}
        x=W-BR;vx=-Math.abs(vx);SFX.wall();
      }
      if(y-BR<0){y=BR;vy=Math.abs(vy);SFX.wall();}

      // Paddle
      if(vy>0&&x+BR>s.paddle.x&&x-BR<s.paddle.x+PW&&y+BR>PY&&y-BR<PY+PH){
        y=PY-BR;
        const rel=(x-s.paddle.x)/PW;
        const angle=-Math.PI/2+(rel-.5)*Math.PI*.7;
        const spd=ballSpeed(s.level)*(isSlow?SLOW_MULT:1);
        vx=Math.cos(angle)*spd; vy=Math.sin(angle)*spd;
        if(vy>-1)vy=-1;
        SFX.paddle();
        if(isCatch){b.caught=true;b.catchOff=x-(s.paddle.x+PW/2);b.x=x;b.y=y;b.vx=vx;b.vy=vy;s.balls[idx]=b;return;}
      }

      // Bricks
      let brickHit=false;
      for(const bk of s.bricks){
        if(!bk.alive)continue;
        if(x+BR>bk.x&&x-BR<bk.x+bk.w&&y+BR>bk.y&&y-BR<bk.y+bk.h){
          brickHit=true;
          bk.hits++;
          const ok=bk.hits>=bk.maxHits;
          if(bk.type!=='gold'){
            if(ok){bk.alive=false;s.score+=bk.pts;
              s.hyper=Math.min(s.hyper+(bk.type==='silver'?12:6),s.hyperMax);
              SFX[bk.type==='silver'?'brickSilver':'brickNormal']();
              spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
              if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y+bk.h/2,w:28,h:18,vy:2.2,type:bk.pu});
              if(Math.random()<(bk.type==='silver'?0.7:0.38)) spawnCoin(bk.x+bk.w/2,bk.y+bk.h/2,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
            } else{spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,'#ccc',4);s.score+=10;addHyper(s,3);SFX.brickSilver();}
          } else { SFX.brickGold(); }
          const ol=x+BR-bk.x, or2=bk.x+bk.w-(x-BR);
          const ot=y+BR-bk.y, ob=bk.y+bk.h-(y-BR);
          if(Math.min(ol,or2)<Math.min(ot,ob)){
            if(ol<or2){x=bk.x-BR;} else{x=bk.x+bk.w+BR;}
            vx=-vx;
          } else {
            if(ot<ob){y=bk.y-BR;} else{y=bk.y+bk.h+BR;}
            vy=-vy;
          }
          break;
        }
      }
      if(brickHit) break; // stop sub-stepping after a bounce

      // Enemies
      for(const e of s.enemies){
        if(!e.alive)continue;
        const ex=e.x-e.w/2, ey=e.type==='crawler'?e.y-e.h:e.y;
        if(x+BR>ex&&x-BR<ex+e.w&&y+BR>ey&&y-BR<ey+e.h){
          e.hp--;
          if(e.hp<=0){e.alive=false;s.score+=e.type==='crawler'?350:200;addHyper(s,25);SFX.enemyDie();
            spawnFX(e.x,e.y,e.color,14);
            if(Math.random()<.4)s.drops.push({x:e.x-14,y:e.y,w:28,h:18,vy:2,type:PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)]});
            if(Math.random()<0.6) spawnCoin(e.x,e.y,50,'gold');
          } else spawnFX(e.x,e.y,'#aaa',5);
          vy=-Math.abs(vy); break;
        }
      }

    } // end substeps

    if(y+BR>H+8)dead.push(idx);
    else{b.x=x;b.y=y;b.vx=vx;b.vy=vy;s.balls[idx]=b;}
  });

  for(let i=dead.length-1;i>=0;i--)s.balls.splice(dead[i],1);

  // ── Boss ball collision (post-move, one hit per ball per frame) ──
  if(s.boss&&s.boss.alive&&!s.boss.entering&&s.boss.hitCooldown===0){
    const boss=s.boss;
    const faceX=boss.x, faceY=boss.y-boss.h/2+20, faceR=36;
    for(const ball of s.balls){
      if(ball.caught) continue;
      const dx=ball.x-faceX, dy=ball.y-faceY;
      const dist=Math.hypot(dx,dy);
      if(dist<faceR+BR){
        boss.hp--; boss.hitFlash=8; boss.hitCooldown=30;
        addHyper(s,8); s.score+=100; SFX.bossHit();
        spawnFX(ball.x,ball.y,'#ff2d55',10);
        if(Math.random()<0.3) spawnCoin(boss.x+(Math.random()-0.5)*50,boss.y+30,30,'gold');
        const nx=dist>0.5?dx/dist:0;
        const ny=dist>0.5?dy/dist:-1;
        const spd=ballSpeed(s.level)*(isSlow?SLOW_MULT:1);
        ball.vx=nx*spd; ball.vy=ny*spd;
        if(ball.vy>-1) ball.vy=-Math.abs(ball.vx||spd);
        const sp2=Math.hypot(ball.vx,ball.vy);
        if(sp2>0.01){ball.vx=ball.vx/sp2*spd; ball.vy=ball.vy/sp2*spd;}
        else{ball.vx=0; ball.vy=-spd;}
        ball.x=faceX+nx*(faceR+BR+4);
        ball.y=faceY+ny*(faceR+BR+4);
        if(ball.y>PY-BR-4) ball.y=PY-BR-4;
        // Final NaN guard
        if(!isFinite(ball.vx)||!isFinite(ball.vy)||!isFinite(ball.x)||!isFinite(ball.y)){
          ball.x=W/2; ball.y=PY-BR-20;
          const spd2=ballSpeed(s.level); ball.vx=0; ball.vy=-spd2;
        }
        if(boss.hp<=Math.floor(boss.maxHp*0.5)&&!boss.burstMode){
          boss.burstMode=true; SFX.bossRoar(); spawnFX(boss.x,boss.y,'#ff9f0a',30);
        }
        if(boss.hp<=Math.floor(boss.maxHp*0.25)&&!boss.enrageMode&&!boss.transforming){
          boss.transforming=true; boss.transformProgress=0;
          SFX.bossRoar(); spawnFX(boss.x,boss.y,'#ff9f0a',20);
        }
        if(boss.hp<=0&&boss.alive&&!boss.dying){
          boss.alive=false; boss.dying=true; boss.dyingTimer=210; boss.dyingExpTimer=8;
          SFX.bossDie();
        }
        break;
      }
    }
  }
  if(s.balls.length===0&&!(s.boss&&s.boss.dying)){
    SFX.lostBall();
    s.lives--;
    s.phase=s.lives<=0?'gameover':'dead';
    if(s.lives<=0) SFX.gameover();
    s.drops=[];s.lasers=[];s.eLasers=[];s.enemies=[];s.fx={};s.paddle.w=80;s.laserOn=false;s.stunTimer=0;
    return;
  }

  // Drops
  for(let i=s.drops.length-1;i>=0;i--){
    const d=s.drops[i];d.y+=d.vy;
    if(d.y+d.h>PY&&d.y<PY+PH&&d.x+d.w>s.paddle.x&&d.x<s.paddle.x+PW){applyPU(d.type);SFX.puCatch();s.drops.splice(i,1);}
    else if(d.y>H+10)s.drops.splice(i,1);
  }

  // Coins
  for(let i=s.coins.length-1;i>=0;i--){
    const c=s.coins[i];
    c.y+=c.vy; c.spin+=0.14;
    if(c.y+8>PY&&c.y<PY+PH&&c.x+8>s.paddle.x&&c.x-8<s.paddle.x+PW){
      s.score+=c.value;
      s.coinCount++;
      _saveWallet(_wallet+1);
      const col=c.tier==='gold'?'#ffd60a':c.tier==='silver'?'#ddd':'#cd7f32';
      s.floaters.push({x:c.x,y:PY-12,vy:-1.1,life:1,text:`+${c.value}`,color:col});
      SFX.coin();
      s.coins.splice(i,1);
    } else if(c.y>H+16) s.coins.splice(i,1);
  }

  // Score floaters
  for(let i=s.floaters.length-1;i>=0;i--){
    const f=s.floaters[i]; f.y+=f.vy; f.life-=0.022;
    if(f.life<=0) s.floaters.splice(i,1);
  }

  // ── Skin effects ──────────────────────────────────────────────
  // Ball trail (stores recent ball positions)
  s.balls.forEach(b=>{
    if(!b.caught&&s.ballTrail.length<14)
      s.ballTrail.push({x:b.x,y:b.y,life:1});
  });
  for(let i=s.ballTrail.length-1;i>=0;i--){
    s.ballTrail[i].life-=0.12;
    if(s.ballTrail[i].life<=0) s.ballTrail.splice(i,1);
  }
  // Shadow skin: store paddle ghost positions
  const _skId=_equipped;
  if(_skId==='shadow'){
    s.shadowTrail.push({x:s.paddle.x,w:PW,life:1});
    if(s.shadowTrail.length>7) s.shadowTrail.shift();
    for(const tr of s.shadowTrail) tr.life=Math.max(tr.life-0.04,0);
  } else {
    if(s.shadowTrail.length) s.shadowTrail=[];
  }
  // Spawn skin particles (cap at 45 total)
  if(s.skinParts.length<45){
    const px=s.paddle.x;
    if(_skId==='fire'&&Math.random()<0.38){
      const side=Math.random()<0.5;
      s.skinParts.push({x:px+(side?Math.random()*14:PW-Math.random()*14),y:PY+PH*0.4,
        vx:(Math.random()-0.5)*1.1,vy:-1.1-Math.random()*1.6,
        life:1,decay:0.044,size:2+Math.random()*2.5,col:Math.random()<0.55?'#ff6600':'#ffaa00',type:'ember'});
    }
    if(_skId==='ice'&&Math.random()<0.2){
      s.skinParts.push({x:px+8+Math.random()*(PW-16),y:PY,
        vx:(Math.random()-0.5)*0.4,vy:-0.45-Math.random()*0.55,
        life:1,decay:0.017,size:2+Math.random()*2,col:Math.random()<0.35?'#ffffff':'#aaeeff',type:'snow'});
    }
    if(_skId==='toxic'&&Math.random()<0.22){
      s.skinParts.push({x:px+12+Math.random()*(PW-24),y:PY-1,
        vx:(Math.random()-0.5)*0.35,vy:-0.55-Math.random()*0.5,
        life:1,decay:0.019,size:2.5+Math.random()*2.5,col:Math.random()<0.5?'#22ff44':'#aaff22',type:'bubble',wobble:Math.random()*Math.PI*2});
    }
    if(_skId==='gold'&&Math.random()<0.28){
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*0.7,vy:-0.25-Math.random()*0.55,
        life:1,decay:0.03,size:1+Math.random()*2,col:Math.random()<0.5?'#ffd60a':'#ffe566',type:'spark'});
    }
    if(_skId==='galaxy'&&Math.random()<0.3){
      const gc=['#7b2ff7','#e040fb','#00ddff','#ffd60a','#ff5af2'];
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*0.9,vy:-0.5-Math.random()*0.9,
        life:1,decay:0.024,size:1.5+Math.random()*2.5,col:gc[Math.floor(Math.random()*gc.length)],type:'star',rot:Math.random()*Math.PI*2});
    }
    if(_skId==='boss'&&Math.random()<0.3){
      const side=Math.random()<0.5;
      s.skinParts.push({x:px+(side?Math.random()*12:PW-Math.random()*12),y:PY+PH*0.4,
        vx:(Math.random()-0.5)*1.4,vy:-0.9-Math.random()*1.3,
        life:1,decay:0.04,size:2+Math.random()*3,col:Math.random()<0.6?'#ff2200':'#ff6600',type:'ember'});
    }
    if(_skId==='classic'&&Math.random()<0.1){
      s.skinParts.push({x:px+Math.random()*PW,y:PY+Math.random()*PH,
        vx:(Math.random()-0.5)*0.5,vy:-0.3-Math.random()*0.4,
        life:1,decay:0.032,size:1.5+Math.random()*1.5,col:'#4da6ff',type:'spark'});
    }
  }
  // Update skin particles
  for(let i=s.skinParts.length-1;i>=0;i--){
    const p=s.skinParts[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.type==='ember'){p.vy*=0.97;p.vx*=0.97;}
    if(p.type==='bubble'&&p.wobble!==undefined) p.x+=Math.sin(p.wobble+=0.12)*0.35;
    if(p.type==='star'&&p.rot!==undefined) p.rot+=0.07;
    if(p.life<=0) s.skinParts.splice(i,1);
  }

  // Player lasers
  for(let i=s.lasers.length-1;i>=0;i--){
    const l=s.lasers[i];l.y+=l.vy;let hit=false;
    for(const bk of s.bricks){
      if(!bk.alive)continue;
      if(l.x+l.w>bk.x&&l.x<bk.x+bk.w&&l.y<bk.y+bk.h&&l.y+l.h>bk.y){
        if(bk.type!=='gold'){bk.hits++;
          if(bk.hits>=bk.maxHits){bk.alive=false;s.score+=bk.pts;
            addHyper(s,6);
            spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#4da6ff',8);
            if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y,w:28,h:18,vy:2.2,type:bk.pu});
            if(Math.random()<(bk.type==='silver'?0.7:0.38)) spawnCoin(bk.x+bk.w/2,bk.y,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
          }else spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,'#ccc',4);
        }
        hit=true;break;
      }
    }
    if(!hit){
      for(const e of s.enemies){
        if(!e.alive)continue;
        const ex=e.x-e.w/2, ey=e.type==='crawler'?e.y-e.h:e.y;
        if(l.x+l.w>ex&&l.x<ex+e.w&&l.y<ey+e.h&&l.y+l.h>ey){
          e.hp--;
          if(e.hp<=0){e.alive=false;s.score+=e.type==='crawler'?350:200;addHyper(s,25);SFX.enemyDie();
            spawnFX(e.x,e.y,e.color,14);
            if(Math.random()<.4)s.drops.push({x:e.x-14,y:e.y,w:28,h:18,vy:2,type:PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)]});
            if(Math.random()<0.6) spawnCoin(e.x,e.y,50,'gold');
          }
          hit=true;break;
        }
      }
    }
    if(hit||l.y+l.h<0)s.lasers.splice(i,1);
  }

  // Hyper beam
  if(s.hyperBeam){
    const beam=s.hyperBeam;
    beam.timer--;
    // Every 3 frames, destroy everything in the beam column
    if(beam.timer%3===0){
      const bw=32; // beam half-width
      for(const bk of s.bricks){
        if(!bk.alive||bk.type==='gold')continue;
        if(bk.x+bk.w>beam.x-bw&&bk.x<beam.x+bw){
          bk.hits=bk.maxHits; bk.alive=false; s.score+=bk.pts;
          addHyper(s,2);
          spawnFX(bk.x+bk.w/2,bk.y+bk.h/2,(bk.color&&bk.color[0])||'#ff0',10);
          if(bk.pu)s.drops.push({x:bk.x+bk.w/2-14,y:bk.y,w:28,h:18,vy:2.2,type:bk.pu});
          if(Math.random()<0.25) spawnCoin(bk.x+bk.w/2,bk.y+bk.h/2,bk.type==='silver'?25:Math.max(10,Math.round(bk.pts/10)*10),bk.type==='silver'?'silver':'bronze');
        }
      }
      for(const e of s.enemies){
        if(!e.alive)continue;
        if(e.x+e.w/2>beam.x-bw&&e.x-e.w/2<beam.x+bw){
          e.alive=false; s.score+=e.type==='crawler'?350:200;
          spawnFX(e.x,e.y,e.color,16);
          if(Math.random()<0.5) spawnCoin(e.x,e.y,50,'gold');
        }
      }
      // Also destroy enemy lasers in beam path
      for(let i=s.eLasers.length-1;i>=0;i--){
        const el=s.eLasers[i];
        if(el.x+el.w>beam.x-bw&&el.x<beam.x+bw) s.eLasers.splice(i,1);
      }
    }
    if(beam.timer<=0) s.hyperBeam=null;
  }

  // ── Boss tick ────────────────────────────────────────────────
  if(s.boss&&(s.boss.alive||s.boss.dying)){
    const b=s.boss;
    b.phase+=0.04;

    // ─ Entry: slide in from top ─
    if(b.entering){
      b.entryProgress=Math.min(b.entryProgress+0.014,1);
      const ease=1-Math.pow(1-b.entryProgress,3);
      b.y=-140+230*ease;
      if(b.entryProgress>=1){
        b.entering=false; b.y=90;
        spawnFX(b.x,b.y+20,'#ff2d55',28);
        SFX.bossRoar();
      }
      return;
    }

    // ─ Death animation ─
    if(b.dying){
      b.dyingTimer--;
      b.dyingExpTimer--;
      const prog=1-b.dyingTimer/210;
      if(b.dyingExpTimer<=0){
        spawnFX(
          b.x+(Math.random()-0.5)*120,b.y+(Math.random()-0.5)*80,
          ['#ff2d55','#ff9f0a','#ffd60a','#fff','#bf5af2'][Math.floor(Math.random()*5)],
          Math.floor(10+prog*25)
        );
        b.dyingExpTimer=Math.max(2,Math.floor(14-prog*12));
      }
      if(b.dyingTimer<=0) s.phase='bossdead';
      return;
    }

    if(b.hitFlash>0) b.hitFlash--;
    if(b.hitCooldown>0) b.hitCooldown--;

    // ─ Transformation animation: hold still while cocoon opens ─
    if(b.transforming){
      b.transformProgress=Math.min(b.transformProgress+0.008,1);
      if(b.transformProgress>=1){
        b.transforming=false; b.enrageMode=true;
        SFX.bossRoar(); spawnFX(b.x,b.y,'#ff2d55',40); b.vx*=1.5;
      }
      return;
    }

    // Movement: side-to-side, faster when enraged
    b.x += b.vx * (b.enrageMode?1+Math.sin(b.phase)*0.5:1);
    if(b.x-b.w/2<8){b.x=8+b.w/2;b.vx=Math.abs(b.vx);}
    if(b.x+b.w/2>W-8){b.x=W-8-b.w/2;b.vx=-Math.abs(b.vx);}

    // Subtle vertical drift when enraged
    if(b.enrageMode){
      b.y+=Math.sin(b.phase*1.3)*0.5;
      b.y=Math.max(50,Math.min(130,b.y));
    }

    // Blink
    b.blinkTimer--;
    if(b.blinkTimer<=0){
      b.eyeL.open=b.eyeL.open>0?0:1;
      b.eyeR.open=b.eyeR.open>0?0:1;
      b.blinkTimer=b.eyeL.open?100+Math.random()*80:8;
    }

    // Shooting patterns
    b.shootTimer--;
    if(b.shootTimer<=0){
      const cx=b.x, cy=b.y+b.h/2;
      if(b.enrageMode){
        // Spread: 3 bullets in a fan
        [-0.4,0,0.4].forEach(a=>{
          const spd2=4.5+s.level*0.1;
          s.eLasers.push({x:cx,y:cy,w:5,h:14,vx:Math.sin(a)*spd2,vy:Math.cos(a)*spd2,isBoss:true});
        });
        SFX.enemyShoot();
        b.shootTimer=120;
      } else if(b.burstMode){
        // Double burst aimed at paddle
        [-0.25,0.25].forEach((off,i)=>{
          setTimeout(()=>{
            if(!s.boss||!s.boss.alive)return;
            const tx=s.paddle.x+s.paddle.w/2, ty=PY;
            const dx=tx-b.x, dy=ty-b.y;
            const dist=Math.hypot(dx,dy);
            const spd3=4.8;
            s.eLasers.push({x:b.x,y:b.y+b.h/2,w:5,h:14,
              vx:(dx/dist+off)*spd3,vy:(dy/dist)*spd3,isBoss:true});
            SFX.enemyShoot();
          },i*120);
        });
        b.shootTimer=190;
      } else {
        // Aimed single shot
        const tx=s.paddle.x+s.paddle.w/2, ty=PY;
        const dx=tx-b.x, dy=ty-b.y, dist=Math.hypot(dx,dy);
        const spd4=4.5;
        s.eLasers.push({x:b.x,y:b.y+b.h/2,w:5,h:14,
          vx:dx/dist*spd4, vy:dy/dist*spd4, isBoss:true});
        SFX.enemyShoot();
        b.shootTimer=240;
      }
    }

    // Stun shot — periodic, 3-shot spread aimed at paddle, stuns instead of dealing damage
    b.stunShotTimer--;
    if(b.stunShotTimer<=0){
      const tx=s.paddle.x+s.paddle.w/2, ty=PY;
      const dx=tx-b.x, dy=ty-b.y, dist=Math.hypot(dx,dy);
      const spd=3.2;
      [-0.22,0,0.22].forEach(off=>{
        s.eLasers.push({x:b.x,y:b.y+b.h/2,w:12,h:12,
          vx:(dx/dist+off)*spd,vy:dy/dist*spd,isBoss:true,isStun:true});
      });
      SFX.stunShot();
      b.stunShotTimer=380;
    }

    // Hyper beam hits boss
    if(s.hyperBeam&&b.hitCooldown===0){
      const beam=s.hyperBeam;
      if(b.x+b.w/2>beam.x-32&&b.x-b.w/2<beam.x+32){
        if(beam.timer%6===0){
          b.hp=Math.max(0,b.hp-1); b.hitFlash=8; b.hitCooldown=6;
          addHyper(s,3); s.score+=50; SFX.bossHit();
          spawnFX(b.x+(Math.random()-0.5)*b.w,b.y,'#ff0',6);
          if(b.hp<=0&&b.alive&&!b.dying){
            b.alive=false; b.dying=true; b.dyingTimer=210; b.dyingExpTimer=8;
            SFX.bossDie();
          }
          if(b.hp<=Math.floor(b.maxHp*0.5)&&!b.burstMode){b.burstMode=true;SFX.bossRoar();}
          if(b.hp<=Math.floor(b.maxHp*0.25)&&!b.enrageMode&&!b.transforming){b.transforming=true;b.transformProgress=0;SFX.bossRoar();spawnFX(b.x,b.y,'#ff9f0a',20);}
        }
      }
    }

    // Player lasers hit boss face
    for(let i=s.lasers.length-1;i>=0;i--){
      const l=s.lasers[i];
      if(b.hitCooldown>0) break;
      const faceX=b.x,faceY=b.y-b.h/2+20,faceR=36;
      if(Math.hypot(l.x-faceX,l.y-faceY)<faceR+8){
        b.hp=Math.max(0,b.hp-1); b.hitFlash=8;
        addHyper(s,5); s.score+=50; SFX.bossHit();
        spawnFX(l.x,l.y,'#bf5af2',6);
        s.lasers.splice(i,1);
        if(b.hp<=0&&b.alive&&!b.dying){
          b.alive=false; b.dying=true; b.dyingTimer=210; b.dyingExpTimer=8;
          SFX.bossDie();
        }
        if(b.hp<=Math.floor(b.maxHp*0.5)&&!b.burstMode){b.burstMode=true;SFX.bossRoar();}
        if(b.hp<=Math.floor(b.maxHp*0.25)&&!b.enrageMode&&!b.transforming){b.transforming=true;b.transformProgress=0;SFX.bossRoar();spawnFX(b.x,b.y,'#ff9f0a',20);}
      }
    }
  }



  for(let i=s.particles.length-1;i>=0;i--){
    const p=s.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.decay;
    if(p.life<=0)s.particles.splice(i,1);
  }

  if(s.phase==='playing'){
    if(s.level%13===0){
      // Boss level: only win via bossdead (set by setTimeout after boss dies)
    } else if(s.bricks.length>0&&s.bricks.every(b=>!b.alive||b.type==='gold')){
      s.lifeBonus=s.lives*500;
      s.score+=s.lifeBonus;
      s.phase= s.level%13===12 ? 'win_boss' : 'win';
      SFX.levelUp();
    }
  }
}
function draw(){
  const sc=SC(),s=st,now=performance.now(),PW=s.paddle.w;
  ctx.save();ctx.scale(sc,sc);

  // Background
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.022)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Wall-break indicator
  if(s.wallBreak){
    ctx.fillStyle='rgba(48,209,88,.1)';ctx.fillRect(W-6,0,6,H);
    ctx.strokeStyle='#30d158';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(W-2,0);ctx.lineTo(W-2,H);ctx.stroke();ctx.setLineDash([]);
  }

  // Particles

    const bw=32;
    // Outer glow
    const grad=ctx.createLinearGradient(beam.x-bw*2,0,beam.x+bw*2,0);
    grad.addColorStop(0,'rgba(255,80,0,0)');
    grad.addColorStop(0.3,`rgba(255,200,0,${0.3*progress})`);
    grad.addColorStop(0.5,`rgba(255,255,255,${0.9*progress})`);
    grad.addColorStop(0.7,`rgba(255,200,0,${0.3*progress})`);
    grad.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(beam.x-bw*2,0,bw*4,PY);
    // Core beam
    ctx.shadowColor='#fff';ctx.shadowBlur=30;
    const coreGrad=ctx.createLinearGradient(beam.x-6,0,beam.x+6,0);
    coreGrad.addColorStop(0,'rgba(255,150,0,0)');
    coreGrad.addColorStop(0.5,`rgba(255,255,255,${progress})`);
    coreGrad.addColorStop(1,'rgba(255,150,0,0)');
    ctx.fillStyle=coreGrad;
    ctx.fillRect(beam.x-6,0,12,PY);
    ctx.shadowBlur=0;
    // Impact flash at paddle
    ctx.fillStyle=`rgba(255,220,100,${0.6*progress*Math.random()})`;
    ctx.beginPath();ctx.ellipse(beam.x,PY,bw*1.5,10,0,0,Math.PI*2);ctx.fill();
  }

  // Hyper gauge bar (above bottom HUD)
  const gaugeW=W-120, gaugeX=60, gaugeY=H-34;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(gaugeX-1,gaugeY-1,gaugeW+2,10);
  const fillW=gaugeW*(s.hyper/s.hyperMax);
  const full=s.hyper>=s.hyperMax;
  if(fillW>0){
    const gg=ctx.createLinearGradient(gaugeX,0,gaugeX+gaugeW,0);
    if(full){
      // Pulsing gold when ready
      const pulse=0.7+Math.sin(performance.now()/120)*0.3;
      gg.addColorStop(0,`rgba(255,200,0,${pulse})`);
      gg.addColorStop(0.5,`rgba(255,255,100,${pulse})`);
      gg.addColorStop(1,`rgba(255,150,0,${pulse})`);
    } else {
      gg.addColorStop(0,'#ff2d55');gg.addColorStop(0.5,'#ff9f0a');gg.addColorStop(1,'#ffd60a');
    }
    ctx.fillStyle=gg;ctx.fillRect(gaugeX,gaugeY,fillW,8);
  }
  // Gauge label
  ctx.font='bold 9px Courier New';ctx.textAlign='left';
  ctx.fillStyle=full?'#ffd60a':'#888';
  ctx.fillText('HYPER',gaugeX-54,gaugeY+7);
  ctx.textAlign='right';
  ctx.fillStyle=full?'#ffd60a':'#555';
  ctx.fillText(full?'X / 3×TAP':'',gaugeX+gaugeW+52,gaugeY+7);


  const active=Object.entries(s.fx).filter(([,v])=>v&&v>now);
  active.forEach(([k],i)=>{
    const d=PU[k];if(!d)return;
    const secs=Math.ceil((s.fx[k]-now)/1000);
    const bx=4+i*72,by=4;
    ctx.fillStyle=d.bg;ctx.strokeStyle=d.color;ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,by,68,16,4);ctx.fill();ctx.stroke();
    ctx.fillStyle=d.color;ctx.font='bold 9px Courier New';ctx.textAlign='left';
    ctx.fillText(`${d.emoji} ${d.label} ${secs}s`,bx+3,by+11);
  });

  // Bottom HUD bar
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H-38,W,38);
  ctx.font='11px Courier New';
  ctx.fillStyle='#4da6ff';ctx.textAlign='left';ctx.fillText(`LVL ${s.level}`,6,H-7);
  ctx.fillStyle='#ffd60a';ctx.textAlign='center';ctx.fillText(`SCORE ${s.score}`,W/2,H-7);
  // Coin counter (shows persistent wallet total)
  ctx.textAlign='left';
  const coinPulse=s.coinCount>0&&Math.floor(performance.now()/400)%2===0;
  ctx.fillStyle=coinPulse?'#ffe566':'#ffd60a';
  ctx.shadowColor='#ffd60a';ctx.shadowBlur=coinPulse?6:0;
  ctx.fillText(`🪙${_wallet}`,W*0.72,H-7);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff2d55';ctx.textAlign='right';
  ctx.fillText('❤️'.repeat(Math.max(s.lives,0)),W-6,H-7);

  // Phase overlays
  ctx.textAlign='center';
  if(s.phase==='idle'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 32px Courier New';ctx.fillText('ARKANOID',W/2,75);
    ctx.font='11px Courier New';
    [['↔️ Breit','#4da6ff'],['🐢 Langsam','#30d158'],['⚡ Multiball','#ffd60a'],
     ['❤️ +Leben','#ff2d55'],['🔫 Laser  (Z / Doppeltap)','#bf5af2'],
     ['🧲 Catch – klebt, Tippen=Abschuss','#ff9f0a'],['🚪 Break – Wand öffnet sich','#30d158'],
     ['⬜ Silber: Mehrfachtreffer','#aaa'],['🟡 Gold: unzerstörbar','#b8860b'],
     ['👾 Gegner ab Lv 2','#ff6b82'],
     ['🕷️ Crawler ab Lv 3 – frisst Blöcke!','#00e5ff'],
     ['⚡ HYPER: Gauge füllen → X / 3×Tap = Laserstrahl!','#ffd60a'],
     ['💀 Boss DOH ab Lv 13 – nur Gesicht trifft!','#bf5af2'],
     ['💰 Münzen fangen für Bonuspunkte!','#ffd60a'],
    ].forEach(([t,c],i)=>{ctx.fillStyle=c;ctx.fillText(t,W/2,112+i*20);});
    ctx.fillStyle='#4da6ff';ctx.font='15px Courier New';
    ctx.fillText('Tippen / SPACE zum Starten',W/2,H-30);
    // Shop button
    const sb=SHOP_BTN;
    const sbHover=false;
    ctx.fillStyle='rgba(255,214,10,0.12)';ctx.strokeStyle='#ffd60a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(sb.x,sb.y,sb.w,sb.h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd60a';ctx.font='bold 13px Courier New';ctx.textAlign='center';
    ctx.shadowColor='#ffd60a';ctx.shadowBlur=8;
    ctx.fillText('🛍 SKIN SHOP',W/2,sb.y+20);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,214,10,0.5)';ctx.font='10px Courier New';
    ctx.fillText(`🪙 ${_wallet} Münzen`,W/2,sb.y+sb.h+14);
  }
  if(s.phase==='dead'){
    if(s.deadCause==='boss'){
      // ── Boss-bullet death screen ──
      const t=performance.now();
      // Pulsing dark red overlay
      const pulse=0.55+Math.sin(t*0.004)*0.1;
      ctx.fillStyle=`rgba(60,0,0,${pulse})`;ctx.fillRect(0,0,W,H);
      // Bullet icon flash
      const iconPulse=Math.sin(t*0.008)*0.4+0.6;
      ctx.font=`${Math.floor(36+iconPulse*6)}px Courier New`;
      ctx.fillStyle=`rgba(255,80,0,${iconPulse})`;
      ctx.fillText('💥',W/2,H/2-52);
      // Title
      ctx.shadowColor='#ff4400';ctx.shadowBlur=18;
      ctx.fillStyle='#ff5522';ctx.font='bold 22px Courier New';
      ctx.fillText('VON DOH ERSCHOSSEN!',W/2,H/2-12);
      ctx.shadowBlur=0;
      // Flavor line
      ctx.fillStyle='#cc6644';ctx.font='12px Courier New';
      ctx.fillText('Der Boss zeigt keine Gnade...',W/2,H/2+16);
      // Continue prompt (blinking)
      if(Math.floor(t/500)%2===0){
        ctx.fillStyle='#ff9f0a';ctx.font='bold 13px Courier New';
        ctx.fillText('Tippen zum Weiterspielen',W/2,H/2+44);
      }
    } else {
      // ── Normal ball-lost screen ──
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,H/2-48,W,96);
      ctx.fillStyle='#ff2d55';ctx.font='bold 24px Courier New';ctx.fillText('BALL VERLOREN!',W/2,H/2-8);
      ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen zum Weiterspielen',W/2,H/2+26);
    }
  }
  if(s.phase==='win_boss'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#bf5af2';ctx.font='bold 26px Courier New';ctx.fillText('⚠ BOSS NAHT! ⚠',W/2,H/2-40);
    ctx.fillStyle='#ff2d55';ctx.font='bold 20px Courier New';ctx.fillText('D O H',W/2,H/2);
    ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen zum Kampf!',W/2,H/2+40);
  }
  if(s.phase==='bossdead'){
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd60a';ctx.font='bold 28px Courier New';ctx.fillText('DOH BESIEGT! 🏆',W/2,H/2-30);
    ctx.fillStyle='#30d158';ctx.font='bold 15px Courier New';ctx.fillText(`+${s.lives*1000} Leben-Bonus!`,W/2,H/2+10);
    ctx.fillStyle='#4da6ff';ctx.font='13px Courier New';ctx.fillText('Tippen für nächstes Level',W/2,H/2+45);
  }
  if(s.phase==='win'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,H/2-62,W,124);
    ctx.fillStyle='#30d158';ctx.font='bold 22px Courier New';ctx.fillText('LEVEL GESCHAFFT! 🎉',W/2,H/2-22);
    ctx.fillStyle='#ffd60a';ctx.font='bold 14px Courier New';
    ctx.fillText(`❤️ x${s.lives} Bonus: +${s.lifeBonus||0} Punkte`,W/2,H/2+8);
    ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Tippen für Level '+(s.level+1),W/2,H/2+34);
  }
  if(s.phase==='gameover'){
    ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff2d55';ctx.font='bold 34px Courier New';ctx.fillText('GAME OVER',W/2,H/2-28);
    ctx.fillStyle='#fff';ctx.font='17px Courier New';ctx.fillText('Score: '+s.score,W/2,H/2+8);
    ctx.fillStyle='#4da6ff';ctx.font='13px Courier New';ctx.fillText('Tippen zum Neustart',W/2,H/2+42);
  }

  // ── Pause overlay ─────────────────────────────────────────
  if(paused&&s.phase==='playing'){
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#ffd60a';ctx.shadowBlur=20;
    ctx.fillStyle='#ffd60a';ctx.font='bold 36px Courier New';ctx.textAlign='center';
    ctx.fillText('⏸ PAUSE',W/2,H/2-28);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px Courier New';
    ctx.fillText(`LVL ${s.level}  ·  SCORE ${s.score}  ·  ${'❤️'.repeat(Math.max(s.lives,0))}`,W/2,H/2+10);
    ctx.fillStyle='#888';ctx.font='12px Courier New';
    ctx.fillText('P / SPACE / Tippen zum Weiterspielen',W/2,H/2+36);
  }

  // ── Skin Shop overlay ──────────────────────────────────────
  if(s.phase==='shop'){
    const now2=performance.now();
    ctx.fillStyle='rgba(5,5,18,0.97)';ctx.fillRect(0,0,W,H);
    // Header
    ctx.shadowColor='#ffd60a';ctx.shadowBlur=16;
    ctx.fillStyle='#ffd60a';ctx.font='bold 20px Courier New';ctx.textAlign='center';
    ctx.fillText('🛍  SKIN SHOP',W/2,30);
    ctx.shadowBlur=0;
    ctx.fillStyle='#888';ctx.font='11px Courier New';
    ctx.fillText(`Guthaben:`,W/2-20,52);
    ctx.fillStyle='#ffd60a';ctx.font='bold 11px Courier New';
    ctx.fillText(`🪙 ${_wallet}`,W/2+34,52);
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(8,60);ctx.lineTo(W-8,60);ctx.stroke();

    // Skin cards — 2 columns × 4 rows
    const cardW=234,cardH=78,colGap=6,rowGap=6;
    SKIN_IDS.forEach((id,i)=>{
      const skin=SKINS[id];
      const col=i%2,row=Math.floor(i/2);
      const cx=6+col*(cardW+colGap);
      const cy=66+row*(cardH+rowGap);
      const isOwned=_owned.includes(id);
      const isEq=_equipped===id;
      const canBuy=_wallet>=skin.price&&!isOwned;

      // Card bg
      ctx.fillStyle=isEq?'rgba(255,214,10,0.08)':isOwned?'rgba(48,209,88,0.06)':'rgba(255,255,255,0.04)';
      ctx.strokeStyle=isEq?'#ffd60a':isOwned?'rgba(48,209,88,0.5)':'rgba(255,255,255,0.1)';
      ctx.lineWidth=isEq?1.5:1;
      ctx.beginPath();ctx.roundRect(cx,cy,cardW,cardH,8);ctx.fill();ctx.stroke();

      // Mini paddle preview
      const pg2=ctx.createLinearGradient(cx+8,0,cx+90,0);
      pg2.addColorStop(0,skin.col[0]);pg2.addColorStop(0.5,skin.col[1]);pg2.addColorStop(1,skin.col[2]);
      ctx.fillStyle=pg2;ctx.shadowColor=skin.glow;ctx.shadowBlur=isEq?10:5;
      ctx.beginPath();ctx.roundRect(cx+8,cy+cardH/2-5,82,10,4);ctx.fill();ctx.shadowBlur=0;

      // Name
      ctx.fillStyle=isEq?'#ffd60a':'#eee';ctx.font='bold 11px Courier New';ctx.textAlign='left';
      ctx.fillText(skin.name,cx+98,cy+22);

      // Price / owned status
      if(isEq){
        ctx.fillStyle='#ffd60a';ctx.font='9px Courier New';
        ctx.fillText('✦ EQUIPPED',cx+98,cy+38);
      } else if(isOwned){
        ctx.fillStyle='#30d158';ctx.font='9px Courier New';
        ctx.fillText('✓ OWNED',cx+98,cy+38);
      } else {
        ctx.fillStyle=canBuy?'#ffd60a':'#555';ctx.font='10px Courier New';
        ctx.fillText(`🪙 ${skin.price}`,cx+98,cy+38);
      }

      // Action button
      const btnX=cx+cardW-66,btnY=cy+cardH/2-15,btnW=58,btnH=30;
      if(isEq){
        ctx.fillStyle='rgba(255,214,10,0.18)';ctx.strokeStyle='#ffd60a';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#ffd60a';ctx.font='bold 8px Courier New';ctx.textAlign='center';
        ctx.fillText('ON',btnX+btnW/2,btnY+19);
      } else if(isOwned){
        ctx.fillStyle='rgba(48,209,88,0.18)';ctx.strokeStyle='#30d158';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#30d158';ctx.font='bold 8px Courier New';ctx.textAlign='center';
        ctx.fillText('EQUIP',btnX+btnW/2,btnY+19);
      } else if(canBuy){
        // Pulsing buy button
        const bp=0.8+Math.sin(now2*0.005+i)*0.2;
        ctx.fillStyle=`rgba(255,214,10,${0.15*bp})`;ctx.strokeStyle=`rgba(255,214,10,${bp})`;ctx.lineWidth=1.2;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle=`rgba(255,214,10,${bp})`;ctx.font='bold 8px Courier New';ctx.textAlign='center';
        ctx.fillText('BUY',btnX+btnW/2,btnY+19);
      } else {
        ctx.fillStyle='rgba(80,80,80,0.15)';ctx.strokeStyle='#333';ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,5);ctx.fill();ctx.stroke();
        ctx.fillStyle='#444';ctx.font='bold 8px Courier New';ctx.textAlign='center';
        ctx.fillText(`🪙${skin.price}`,btnX+btnW/2,btnY+19);
      }
    });

    // Back button
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(8,H-44,96,28,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#aaa';ctx.font='bold 11px Courier New';ctx.textAlign='center';
    ctx.fillText('← ZURÜCK',56,H-26);
  }

  ctx.restore();
}

// ── Main loop (fixed timestep) ────────────────────────────────
let lastTs=null,accum=0;
function loop(ts){
  if(lastTs===null){lastTs=ts;accum=0;}
  let delta=ts-lastTs; lastTs=ts;
  if(delta>100)delta=100; // prevent spiral of death
  accum+=delta;
  while(accum>=STEP){tick();accum-=STEP;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
